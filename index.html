<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--pwa-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひび">
<meta name="theme-color" content="#F4EEEA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
<!--/pwa-->
<title>ひび手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app — page header, scrolling content, bottom tab bar; editors slide up as sheets */
:root{
  --bg:#F5EFEB; --surface:#FFFFFF; --surface-2:#FAF6F3; --ink:#232A5C; --ink-2:#6D7092; --ink-3:#A9AABD;
  --line:#E9E1DB; --accent:#E07F78; --accent-ink:#FFFFFF; --sun:#D45850; --sat:#5779B0; --hol:#E9A23B;
  --overlay:rgba(24,26,48,.32); --shadow:0 6px 22px rgba(35,42,92,.08); --sel:#FFFFFF;
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9); --glass-sel:rgba(35,42,92,.07); --glass-shadow:0 10px 30px rgba(35,42,92,.14);
  --f-body:ui-rounded,"SF Pro Rounded","Hiragino Sans","Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-script:"Allura","Snell Roundhand","Apple Chancery",cursive;
  --r:16px; --pay:#1FA046;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#A3A3AD; --ink-3:#66666F;
    --line:#303034; --accent:#EF8A82; --accent-ink:#1A1414; --sun:#F07D74; --sat:#86A6D9; --hol:#EDAE52;
    --overlay:rgba(0,0,0,.6); --shadow:none; --sel:#2C2C2E; color-scheme:dark; --pay:#34C759;
    --glass:rgba(44,44,48,.5); --glass-edge:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.1); --glass-sel:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#A3A3AD; --ink-3:#66666F;
  --line:#303034; --accent:#EF8A82; --accent-ink:#1A1414; --sun:#F07D74; --sat:#86A6D9; --hol:#EDAE52;
  --overlay:rgba(0,0,0,.6); --shadow:none; --sel:#2C2C2E; color-scheme:dark; --pay:#34C759;
    --glass:rgba(44,44,48,.5); --glass-edge:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.1); --glass-sel:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 112px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* floating glass tab bar (iOS 26 style): content scrolls underneath, selected tab gets a sliding glass pill */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
#tabs{position:absolute;left:12px;right:84px;bottom:10px;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;border-radius:999px}
#tabs .pill-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 4);border-radius:999px;background:var(--glass-sel);
  box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .45s cubic-bezier(.3,1.35,.5,1);pointer-events:none}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:500;color:var(--ink-2);padding:6px 0 5px;border-radius:999px;min-width:0}
#tabs button span{white-space:nowrap}
#tabs button[aria-current="page"]{color:var(--accent)}
#fab{position:absolute;right:12px;bottom:10px;width:62px;height:62px;border-radius:50%;color:#fff;display:grid;place-items:center;z-index:6;
  background:var(--accent);border:1px solid rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 14px rgba(0,0,0,.16)}
#fab:active,#tabs button:active{transform:scale(.94)}
@media (hover:none){button:not(#fab):not([data-act="tab"]):not(:disabled):active{opacity:.55}}
/* iOS large-title behaviour: a small blurred title bar fades in once the big title scrolls away */
#topbar{position:absolute;top:0;left:0;right:0;z-index:6;height:46px;display:grid;place-items:center;font-size:16px;font-weight:700;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-bottom:.5px solid var(--glass-edge);opacity:0;pointer-events:none;transition:opacity .2s}
#topbar.show{opacity:1}
#topbar span{transform:translateY(6px);transition:transform .25s}
#topbar.show span{transform:none}
/* page sits back while a sheet is open, like iOS card sheets */
#app{transition:transform .38s cubic-bezier(.2,.9,.25,1),border-radius .38s,filter .38s;transform-origin:50% 100%}
#app.behind{transform:scale(.935) translateY(8px);border-radius:16px;overflow:hidden;filter:brightness(.92)}
.slide-n{animation:slideN .32s cubic-bezier(.2,.9,.25,1)} .slide-p{animation:slideP .32s cubic-bezier(.2,.9,.25,1)}
@keyframes slideN{from{transform:translateX(36px);opacity:.2}to{transform:none;opacity:1}}
@keyframes slideP{from{transform:translateX(-36px);opacity:.2}to{transform:none;opacity:1}}
#fab .ico{width:28px;height:28px;stroke-width:2.2}

.sample-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-top:10px}
.sample-bar button{color:var(--accent);font-weight:700;white-space:nowrap}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.icon-btn .ico{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surface);
  font-weight:500;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{background:transparent;color:var(--sun);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn .ico{width:20px;height:20px}
.script{font-family:var(--f-script);color:var(--accent);font-size:30px;line-height:1;font-weight:400}

/* ---------- Calendar (month) ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;height:76px}
.m-title{display:flex;align-items:baseline;gap:8px}
.m-title .mn{font-size:56px;font-weight:500;line-height:1;letter-spacing:-.02em}
.m-title .my{font-size:15px;color:var(--ink-2)}
.head-icons{display:flex;align-items:center;gap:2px}
.tl-head h1{white-space:nowrap}
/* page headers: the icons keep one size and the gear sits at the same spot on every tab; the title gives way on narrow phones */
.cal-head,.tl-head,.j-head{gap:8px}
.cal-head>:first-child,.tl-head>:first-child,.j-head>:first-child{min-width:0;flex:0 1 auto;overflow:hidden}
.head-icons{flex:none;margin-left:auto;gap:0}
.head-icons .icon-btn{width:40px}
@media (max-width:389px){.head-icons .icon-btn{width:36px}.head-icons .wx-btn{min-width:36px}.tl-head h1{font-size:25px}.m-title .mn{font-size:48px}}
@media (max-width:339px){.head-icons .icon-btn{width:33px}.head-icons .wx-btn{min-width:33px}.head-icons .icon-btn .ico{width:21px;height:21px}.tl-head h1{font-size:21px}.tl-head h1 .yr{font-size:15px}.m-title .mn{font-size:42px}.m-title .my{display:none}}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--ink-2);padding:6px 0 2px}
.dow span.sat{color:var(--sat)} .dow span.sun{color:var(--sun)}
.month{touch-action:pan-y}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:32px repeat(3,19px) 15px;row-gap:2px;padding-bottom:8px;position:relative}
.day{grid-row:1/-1;border-radius:12px;display:flex;flex-direction:column;align-items:center;position:relative;transition:background .15s}
.day .dn{font-size:17px;font-weight:500;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;margin-top:1px}
.day.out .dn{color:var(--ink-3)}
.day.sat .dn{color:var(--sat)} .day.sun .dn,.day.hol .dn{color:var(--sun)}
.day.out.sat .dn,.day.out.sun .dn,.day.out.hol .dn{opacity:.5}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.day.sel{background:var(--sel);box-shadow:var(--shadow)}
.day .md{position:absolute;top:5px;right:4px;width:7px;height:7px;border-radius:50%}
.bar{pointer-events:none;font-size:11px;line-height:17px;height:18px;white-space:nowrap;overflow:hidden;margin:0 2px;padding-left:5px;border-radius:3px;
  border-left:3px solid var(--c);color:var(--ink);position:relative;z-index:1}
.bar.all{background:color-mix(in srgb,var(--c) 30%,transparent)}
.bar.timed{color:var(--ink-2)}
.bar.cl{border-left-color:transparent;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.more{pointer-events:none;grid-row:5;font-size:10px;color:var(--ink-2);text-align:center;line-height:15px;z-index:1}

.detail{padding-top:14px;display:flex;flex-direction:column;gap:10px}
.detail .hol-label{color:var(--sun);font-weight:700;font-size:14px}
.detail h2{margin:0;font-size:26px;font-weight:700;line-height:1.2;text-wrap:balance}
.ev-card{display:grid;grid-template-columns:62px 4px minmax(0,1fr);align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ev-card .t{font-size:18px;font-weight:500;line-height:1.2}
.ev-card .t small{display:block;font-size:12px;color:var(--ink-2);font-weight:400;margin-top:2px}
.ev-card .stripe{align-self:stretch;border-radius:2px;background:var(--c);min-height:26px}
.ev-card .ti{font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.ev-card .ti small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:400}
.ev-card.done .ti{color:var(--ink-3);text-decoration:line-through}
.routine-note{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);padding:2px 4px}
.routine-note button{color:var(--accent);font-weight:700}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mini-entry{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line)}
.mini-entry p{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.mini-entry .lbl{font-size:12px;color:var(--ink);font-weight:700}

/* ---------- Timeline (day) ---------- */
.tl-head{display:flex;align-items:center;justify-content:space-between;height:76px}
.tl-head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.01em}
.tl-head h1 .yr{color:var(--accent)}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;touch-action:pan-y;padding-bottom:10px}
.ws-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.ws-day .w{font-size:11.5px;color:var(--ink-2)}
.ws-day .n{font-size:19px;font-weight:700;width:38px;height:38px;line-height:38px;text-align:center;border-radius:50%}
.ws-day.today .n{color:var(--accent)}
.ws-day.sel .n{background:var(--accent);color:var(--accent-ink)}
.ws-day .dots{display:flex;height:12px}
.ws-day .dots i{width:12px;height:12px;border-radius:50%;background:var(--c);border:1.5px solid var(--bg);margin-left:-4px}
.ws-day .dots i:first-child{margin-left:0}
.tl-sheet{background:var(--surface);border-radius:28px;margin:0 -16px;padding:14px 16px 24px;min-height:60vh;box-shadow:var(--shadow)}
.tl-sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.tl-date{font-size:13px;color:var(--ink-2);margin:0 0 10px}
.tl-date b{color:var(--ink);font-size:16px;margin-right:6px}
.allday-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.allday-row::-webkit-scrollbar{display:none}
.ad-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none}
.ad-item .circ{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.ad-item .circ .ico{width:28px;height:28px}
.ad-item span{font-size:12px;font-weight:700;text-align:center;line-height:1.3;max-width:76px;overflow-wrap:anywhere}
.mood-prompt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;color:var(--ink-2);font-size:13.5px}
.mood-prompt b{color:var(--ink);display:block;font-size:14.5px}
.blobs{display:flex}
.blobs i{width:26px;height:24px;margin-left:-7px;border:2px solid var(--surface)}
.blobs i:first-child{margin-left:0}
.timeline{position:relative;display:flex;flex-direction:column}
/* Structured-style links: dotted, centred on the pills, fading from one event's color into the next (drawn by drawTlLinks) */
.tl-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.timeline:has(.tl-item.dragging) .tl-links{opacity:0}
.tl-item{display:grid;grid-template-columns:52px 64px minmax(0,1fr) 40px;align-items:center;column-gap:6px;padding:6px 0;position:relative}
.tl-item .tm{font-size:12px;color:var(--ink-2);text-align:right;padding-right:4px;align-self:start;padding-top:6px}
.pill{justify-self:center;width:58px;border-radius:29px;background:var(--c);color:#fff;display:grid;place-items:center;position:relative;z-index:1}
.pill .ico{width:26px;height:26px;stroke-width:2}
.tl-item.done .pill{opacity:.55}
.tl-body{text-align:left;min-width:0;padding:4px 0}
.tl-body .meta{font-size:12.5px;color:var(--ink-2)}
.tl-body .tt{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.tl-item.done .tt{color:var(--ink-3);text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;justify-self:center;color:#fff}
.chk .ico{width:16px;height:16px;stroke-width:3;opacity:0}
.chk.on{background:var(--c)} .chk.on .ico{opacity:1}
.tl-gap{padding:6px 0 6px 122px;font-size:12px;color:var(--ink-3)}
.tl-now{display:flex;align-items:center;gap:8px;padding:2px 0 2px 46px;font-size:11.5px;color:var(--accent);font-weight:700}
.tl-now::after{content:"";flex:1;height:2px;background:var(--accent);border-radius:1px}
.tl-now.in{position:absolute;left:0;right:0;z-index:3;padding:0 0 0 6px;transform:translateY(-50%);pointer-events:none}
.tl-now.in::before{content:"";position:absolute;left:85px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.empty{color:var(--ink-2);font-size:14px;text-align:center;padding:28px 12px}

/* ---------- Journal ---------- */
.j-head{display:flex;align-items:center;justify-content:space-between;height:76px}
.ttl{display:flex;align-items:baseline;gap:12px}
.ttl h1{margin:0;font-size:26px;font-weight:700;white-space:nowrap}
@media (max-width:389px){.j-head .ttl{gap:8px}.j-head .ttl .script{font-size:25px}}
@media (max-width:339px){.j-head .ttl .script{display:none}}
.brand{font-size:32px;font-weight:700;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--ink-2);margin-top:4px}
.j-week{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg));border-radius:24px;padding:14px 10px 12px;margin-top:8px}
.j-week .lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);padding:0 6px 8px}
.j-week .lbl button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.jw-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;touch-action:pan-y}
.jw-day{display:flex;flex-direction:column;align-items:center;gap:4px}
.jw-day .blob{width:38px;height:36px;display:grid;place-items:center;background:var(--line);color:#fff}
.jw-day .blob .ico{width:16px;height:16px;stroke-width:3}
.jw-day .blob.none{background:transparent;border:1.5px dashed var(--ink-3)}
.jw-day .n{font-size:15px;font-weight:700;line-height:1.1}
.jw-day .w{font-size:11px;color:var(--ink-2)}
.jw-day.today .n{color:var(--accent)}
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.q-card{background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.q-card .script{font-size:24px}
.q-card p{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.q-card small{font-size:11px;color:var(--ink-2)}
.day-group{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding-top:14px}
.dg-date{text-align:center;padding-top:4px}
.dg-date .d{font-size:30px;font-weight:500;line-height:1;color:var(--accent)}
.dg-date .w{font-size:12px;color:var(--ink-2)}
.dg-list{display:flex;flex-direction:column;gap:8px;min-width:0}
.entry{background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%}
.entry .feels{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.entry .feels span{display:inline-flex;align-items:center;gap:4px}
.entry .feels i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.entry p{margin:0;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.entry .foot{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.entry .foot .tg{color:var(--ink-2)}
.entry img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.more-btn{display:block;margin:16px auto 0;color:var(--accent);font-weight:700;font-size:14px;padding:8px 16px}

/* ---------- Reflection ---------- */
.r-head{display:flex;align-items:center;height:76px}
.r-head h1{margin:0;font-size:26px;font-weight:700}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{font-size:11px;color:var(--ink-2);font-weight:500;letter-spacing:.06em}
.card-eyebrow{font-size:11px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{font-size:12px;padding:4px 10px;border-radius:8px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.ins-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ins-nav button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.ins-nav button:disabled{opacity:.3}
.ins-nav .rng{text-align:center;font-size:13px;color:var(--ink-2)}
.ins-nav .rng b{display:block;font-size:16px;color:var(--ink)}
.ins-lines{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ins-lines li{font-size:14px;line-height:1.7;padding-left:14px;position:relative}
.ins-lines li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wk-days{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.wk-days div{display:grid;grid-template-columns:22px 10px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.wk-days .w{color:var(--ink-2);text-align:center}
.wk-days i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.wk-days span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.chart svg{width:100%;height:auto}
.chart .lab{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
.chart .lab.today{fill:var(--accent);font-weight:700}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .pt{fill:var(--surface);stroke-width:1.5}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:700;line-height:1.2}
.stats span{font-size:11.5px;color:var(--ink-2)}
.rank{display:flex;flex-direction:column;gap:8px}
.rank div{display:grid;grid-template-columns:70px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px}
.rank .trk{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.rank .trk i{display:block;height:100%;border-radius:6px;background:var(--c)}
.rank .c{text-align:right;color:var(--ink-2)}
.donut-wrap{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center}
.donut-wrap svg{width:130px;height:130px}
.donut-wrap .ctr{fill:var(--ink);font-size:20px;font-weight:700;font-family:var(--f-body)}
.donut-wrap .ctr2{fill:var(--ink-2);font-size:9px;font-family:var(--f-body)}
.dlegend{display:flex;flex-direction:column;gap:5px;font-size:13px;min-width:0}
.dlegend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.dlegend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dlegend .c{color:var(--ink-2)}
.words{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:4px 0}
.words span{border-radius:999px;background:var(--surface-2);border:1px solid var(--line);padding:4px 12px;line-height:1.4}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 4px;text-align:center}
.mcal .h{font-size:11px;color:var(--ink-2)}
.mcal .c{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2)}
.mcal .c i{width:24px;height:22px;background:var(--surface-2);border:1px solid var(--line)}
.mcal .c i.on{border:0}
.mcal-nav{display:flex;align-items:center;gap:4px}
.mcal-nav button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.note{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}

/* ---------- Sheets ---------- */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.ov.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:28px 28px 0 0;
  overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.ov.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px - env(safe-area-inset-top,0px))}
.sheet.small{max-width:460px;border-radius:24px;margin:0 12px calc(16px + env(safe-area-inset-bottom,0px));padding-bottom:16px}
.sh-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:20px 0 10px;touch-action:none}
.sh-bar::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--ink-3);opacity:.5}
.sheet.small{transform:translateY(30px) scale(.96)}
.sh-bar b{font-size:16px}
.sh-bar .l{justify-self:start;color:var(--ink-2);padding:6px 0}
.sh-bar .r{justify-self:end;color:var(--accent);font-weight:700;padding:6px 0}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;scroll-margin-top:80px;scroll-margin-bottom:24px}
.inp:focus,.inp:focus-visible{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sh-bar+.fld,.sh-bar+.row2{margin-top:4px}
.mp-year{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.mp-year b{font-size:22px}
.mp-year button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface);color:var(--ink-2)}
.mp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mp-grid button{height:58px;border-radius:14px;background:var(--surface);font-size:17px;font-weight:600}
.mp-grid button.now{color:var(--accent)}
.mp-grid button.cur{background:var(--accent);color:var(--accent-ink)}
.mp-today{width:100%;margin-top:16px}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;text-align:center}
.dp-grid .h{font-size:12px;color:var(--ink-2);padding-bottom:4px}
.dp-grid .h.sat{color:var(--sat)} .dp-grid .h.sun{color:var(--sun)}
.dp-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:16px;font-weight:500}
.dp-d span{width:38px;height:38px;line-height:38px;border-radius:50%}
.dp-d.sun{color:var(--sun)} .dp-d.sat{color:var(--sat)}
.dp-d.today span{color:var(--accent);font-weight:700}
.dp-d.sel span{background:var(--accent);color:var(--accent-ink)}
.dp-d i{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.7}
.inp.title{font-size:20px;font-weight:700}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input.inp[type=date],input.inp[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block}
input.inp[type=date]::-webkit-date-and-time-value,input.inp[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.sw .ico{width:16px;height:16px;stroke-width:3;opacity:0}
.sw[aria-pressed="true"] .ico{opacity:1}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.iconpick button{height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.iconpick button[aria-pressed="true"]{background:var(--c);color:#fff;border-color:transparent}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px}
.toggle span small{display:block;font-size:11.5px;color:var(--ink-2)}
.toggle input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.toggle input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input[type=checkbox]:checked{background:var(--accent)}
.toggle input[type=checkbox]:checked::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row .inp{min-height:40px;padding:8px 12px}
.add-row button{flex:none;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.confirm p{font-size:15px;margin:18px 4px 16px;line-height:1.7}
.confirm .row2 .btn{width:100%}

/* feelings picker */
.feel-head{text-align:center;padding:4px 0 10px}
.feel-head .script{font-size:34px}
.feel-head h2{margin:2px 0 0;font-size:22px}
.feel-head small{font-size:12px;color:var(--ink-2)}
.feel-group{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;border-top:1px solid var(--line);padding:12px 0}
.feel-group .gl{writing-mode:vertical-rl;font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.feel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 4px}
.fb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}
.fb i{width:34px;height:30px;background:var(--c);transition:transform .15s,width .15s,height .15s}
.fb[aria-pressed="true"] i{width:46px;height:42px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.fb[aria-pressed="true"]{color:var(--ink);font-weight:700}
.next-btn{position:sticky;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.next-btn .btn{min-width:150px}
.sel-feels{display:flex;flex-wrap:wrap;gap:6px}
.sel-feels button{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.sel-feels i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-box img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.prompt-q{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px;border:1px solid var(--line)}
.prompt-q b{color:var(--accent);margin-right:4px}

.search-res{display:flex;flex-direction:column;gap:8px}
.search-res button{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px}
.search-res button i{border-radius:2px;background:var(--c)}
.search-res small{display:block;font-size:11.5px;color:var(--ink-2)}
.set-sec{margin-top:18px}
.set-sec h4{margin:0 0 8px;font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.06em}
.set-list{display:flex;flex-direction:column;gap:8px}
/* メールから追加 */
.mail-ta{min-height:260px;font-size:15px;line-height:1.7}
.mcard{background:var(--surface);border-radius:20px;padding:12px 14px 14px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--c);display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.mcard.off{opacity:.5}
.mc-head{display:flex;align-items:center;gap:10px}
.mc-head .seg button{font-size:12.5px;padding:5px 12px}
.mc-on{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.mc-on input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.mc-del{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.mc-del .ico{width:16px;height:16px}
.mcard .inp{min-height:44px;padding:9px 12px;background:var(--surface-2)}
.mcard .mc-title{font-size:17px;font-weight:700}
.mcard .mc-ad{background:transparent;border:0;padding:0 2px;min-height:34px}
.mcard .dt-grid{margin-top:0}
.mc-src{margin:2px 2px 0;font-size:11.5px;color:var(--ink-3);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.mc-src::before{content:"メールより：";font-weight:700}
.mc-addb{width:100%}
.mc-f{position:relative;display:block}
.mc-f>.ico{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--c);pointer-events:none}
.mc-f .inp{padding-left:38px;width:100%}
/* silent camera */
.cam{position:fixed;inset:0;z-index:75;background:#0B0B0F;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);opacity:0;transform:scale(1.03);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1);-webkit-user-select:none;user-select:none;--fh:calc(100dvh - 300px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.cam.in{opacity:1;transform:none}
.cam .ico{width:20px;height:20px}
.cam-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px}
.cam-tools{display:flex;gap:8px;align-items:center}
.cam-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:relative;flex:none;transition:background .2s,color .2s}
.cam-ic[aria-pressed="true"]{background:#fff;color:#111}
.cam-ic b{position:absolute;right:-3px;bottom:-3px;font-size:10px;background:var(--accent);color:#fff;border-radius:8px;padding:0 4px;line-height:15px}
.cam-ic b:empty{display:none}
.cam-st{font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.02em}
.cam-st[aria-pressed="true"]{color:#E8741F}
.cam-chip{height:32px;min-width:48px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cam-stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 12px}
.cam-frame{position:relative;width:min(100%,calc(var(--fh) * .75));aspect-ratio:3/4;border-radius:26px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0);background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.06);transition:aspect-ratio .3s,width .3s;touch-action:none}
.cam.sq .cam-frame{width:min(100%,var(--fh));aspect-ratio:1/1}
.cam-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame video.mirror{transform:scaleX(-1)}
.cam-grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.38) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.38) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(180deg,transparent calc(33.33% - .5px),rgba(255,255,255,.38) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.38) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cam.grid .cam-grid{opacity:1}
.cam-stampv{position:absolute;right:16px;bottom:14px;font:700 15px/1 ui-monospace,Menlo,monospace;color:#FF9A3C;text-shadow:0 0 7px rgba(255,120,30,.85);letter-spacing:.04em;display:none;pointer-events:none}
.cam.stamp .cam-stampv{display:block}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:camFlash .38s ease-out}
@keyframes camFlash{0%{opacity:.92}100%{opacity:0}}
.cam-count{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:700;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.45);pointer-events:none;font-variant-numeric:tabular-nums}
.cam-count.pop{animation:camPop 1s ease-out}
@keyframes camPop{0%{transform:scale(1.35);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:.2}}
.cam-zl{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.45);font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.cam-zl.on{opacity:1}
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;font-size:14px;line-height:1.75;color:rgba(255,255,255,.85);background:#000}
.cam-msg[hidden]{display:none}
.cam-zooms{display:flex;justify-content:center;gap:6px;padding:12px 0 2px;min-height:44px}
.cam-zooms button{min-width:38px;height:30px;padding:0 8px;border-radius:15px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cam-zooms button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#111}
.cam-filters{display:flex;gap:18px;overflow-x:auto;padding:8px 20px 12px;scrollbar-width:none;justify-content:safe center}
.cam-filters::-webkit-scrollbar{display:none}
.cam-filters button{flex:none;font-size:13px;color:rgba(255,255,255,.55);padding:4px 0 6px;position:relative;transition:color .2s}
.cam-filters button[aria-pressed="true"]{color:#fff;font-weight:700}
.cam-filters button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cam-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 30px 16px}
.cam-thumb{justify-self:start;width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.08) center/cover no-repeat;border:2px solid rgba(255,255,255,.25)}
.cam-thumb.on{border-color:rgba(255,255,255,.9)}
.cam-shutter{width:80px;height:80px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;padding:0;background:none}
.cam-shutter i{width:64px;height:64px;border-radius:50%;background:var(--accent);transition:transform .12s}
.cam-shutter:active i{transform:scale(.86)}
.cam-bottom .cam-ic.big{justify-self:end;width:48px;height:48px}
.cam-review{position:absolute;inset:0;background:#0B0B0F;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:camRv .3s cubic-bezier(.2,.9,.25,1)}
.cam-review[hidden]{display:none}
@keyframes camRv{from{opacity:0;transform:translateY(24px)}}
.cam-rv-img{flex:1;min-height:0;display:grid;place-items:center}
.cam-rv-img img{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.cam-rv-act{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.cam-rv-act .btn{width:100%}
.cam-rv-act .cam-rv-w{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.cam-rv-row{display:flex;justify-content:space-between;padding:4px 6px 0}
.cam-rv-row button{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:14px;padding:6px 2px}
.cam-rv-row .ico{width:17px;height:17px}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--accent);transition:opacity .45s ease,transform .5s cubic-bezier(.3,.8,.3,1)}
#splash svg{width:min(52vw,230px);height:auto;overflow:visible}
.sp-pen{fill:none;stroke:#FFF3EE;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spWrite 1.05s cubic-bezier(.6,.05,.35,1) .2s forwards}
@keyframes spWrite{to{stroke-dashoffset:0}}
.sp-dot{fill:#232A5C;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spDot .45s cubic-bezier(.3,1.7,.5,1) 1.22s forwards}
@keyframes spDot{to{transform:scale(1)}}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
@media (prefers-reduced-motion:reduce){.sp-pen{animation:none;stroke-dashoffset:0}.sp-dot{animation:none;transform:none}#splash{transition:opacity .3s}#splash.out{transform:none}}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px) scale(.96);color:var(--ink);
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.3,1.35,.5,1),opacity .25s;z-index:90;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* quick mood check-in */
.quick{background:var(--surface);border-radius:20px;padding:12px 14px 12px;box-shadow:var(--shadow);margin-top:12px}
.quick-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.quick-h b{font-size:14.5px}
.quick-h small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:400}
.quick-h button{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:12.5px;font-weight:700;color:var(--accent);padding:6px 0 6px 8px}
.quick-h button .ico{width:15px;height:15px}
.quick-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 4px;padding-top:12px}
.qb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);min-width:0}
.qb i{width:40px;height:36px;background:var(--c)}
/* on this day */
.memory{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-top:10px}
.memory .script{font-size:22px}
.memory b{display:block;font-size:13px;margin-top:2px}
.memory p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memory img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.wx{display:inline-flex;align-items:center;gap:3px}
.wx .ico{width:14px;height:14px}
/* drag to move on the timeline */
.pill{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tl-item.dragging{z-index:4}
.tl-item.dragging .pill{transform:scale(1.08);box-shadow:0 12px 26px rgba(0,0,0,.25)}
.tl-item.dragging .meta,.tl-item.dragging .tm{color:var(--accent);font-weight:700}
.tl-hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:16px 0 0}
/* tasks */
.icon-btn{position:relative}
.badge{position:absolute;top:3px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.task-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 6px 8px 12px}
.task .chk{--c:var(--accent);width:26px;height:26px}
.task .tt{font-size:15px;overflow-wrap:anywhere}
.task.done .tt{color:var(--ink-3);text-decoration:line-through}
.task .sched{font-size:12.5px;font-weight:700;color:var(--accent);padding:6px 6px;white-space:nowrap}
.task .del{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3)}
.task .del .ico{width:16px;height:16px}
/* templates */
.tpl-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tpl-row::-webkit-scrollbar{display:none}
.tpl{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:13px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tpl .ico{width:15px;height:15px;color:var(--c)}
.tpl small{color:var(--ink-2)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}
.set-row small{color:var(--ink-2)}
.set-row button{color:var(--sun);font-size:13px;padding:6px 8px;flex:none}
/* repeat details */
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdays button{height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.wdays button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.until-row{display:flex;gap:8px;align-items:center}
.until-row .inp{flex:1;min-width:0}
.until-row button{flex:none;font-size:13px;color:var(--ink-2);padding:8px}
.choice p{font-size:15px;margin:18px 4px 14px;line-height:1.7}
.choice .col{display:flex;flex-direction:column;gap:10px}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast button{color:var(--accent);font-weight:700;padding:2px 0;white-space:nowrap;flex:none}
/* search filters */
.filt{margin:0 0 12px}
.filt .lb{font-size:12px;color:var(--ink-2);margin-bottom:6px;display:block}
.filt .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filt .chips::-webkit-scrollbar{display:none}
.filt .chip{flex:none;display:inline-flex;align-items:center;gap:6px}
.filt .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.res-count{font-size:12px;color:var(--ink-2);margin:0 0 2px}
/* plans x mood */
.em-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.em-row.h{border-top:0;padding:0 0 2px}
.em-row .t{display:flex;align-items:center;gap:6px;min-width:0}
.em-row .t i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.em-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em-head{font-size:11px;color:var(--ink-2);text-align:center}
.dv{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.dv::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.dv i{position:absolute;top:0;bottom:0;border-radius:5px}
.dv i.up{left:50%;background:#EDA04B}
.dv i.down{right:50%;background:#6C97C2}
.dv.none{opacity:.35}
/* monthly report */
.report-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.report-btn b{font-size:15px}
.report-btn small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.report-btn .ico{color:var(--ink-3);flex:none}
.rp-nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.rp-nav button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--surface);color:var(--ink-2)}
.rp-nav button:disabled{opacity:.3}
.rp-title{text-align:center}
.rp-title .script{font-size:28px}
.rp-title h2{margin:0;font-size:22px}
.balance{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 8px;background:var(--surface-2)}
.balance i{display:block;height:100%}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photo-grid button{aspect-ratio:1;border-radius:10px;overflow:hidden;max-width:100%}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
.best{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%}
.best .d{font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.best .d small{font-size:13px}
.best b{display:block;font-size:13px}
.best p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .card{box-shadow:none}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini-chips>span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:999px;padding:4px 10px;background:var(--surface-2);border:1px solid var(--line)}
.mini-chips i{width:9px;height:9px;border-radius:50%;background:var(--c)}
/* countdown */
.cd-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.cd-row::-webkit-scrollbar{display:none}
.cd{flex:none;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px 5px 5px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font-size:13px}
.cd .ic{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.cd .ic .ico{width:15px;height:15px}
.cd b{font-weight:700}
/* pay */
.pay-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);margin-top:10px}
.pay-card>span:first-child{flex:1;min-width:0}
.pay-card small{display:block;font-size:12px;color:var(--ink-2)}
.pay-card b{font-size:22px;font-weight:700}
.pay-card .pay-meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.pay-card .ico{color:var(--ink-3);flex:none}
.pay-total{text-align:center;padding:6px 0 4px}
.pay-total b{display:block;font-size:40px;line-height:1.15}
.pay-total small{display:block;color:var(--ink-2);font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--ink-2)}
.shift-list{display:flex;flex-direction:column}
.shift{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%;font-size:13.5px}
.shift:first-child{border-top:0}
.shift .d{font-weight:700}
.shift small{display:block;color:var(--ink-2);font-size:11.5px}
.shift .yen{font-weight:700}
.shift.done .yen{color:var(--pay)}
.shift .yen small{text-align:right;color:var(--pay);font-weight:500}
/* pay ring: pale arc = projected for the month, solid green = shifts already worked */
.e-song{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:10px;margin-top:9px;padding:7px 12px 7px 7px;border-radius:14px;color:#fff;background:#2a2633}
.e-song .bg{position:absolute;inset:-40%;width:180%;height:180%;object-fit:cover;filter:blur(22px) saturate(1.5);z-index:-1}
.e-song::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.12))}
.e-song .art{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.e-song .art .ico{width:18px;height:18px;color:#fff}
.e-song>span:not(.art){min-width:0;flex:1;display:flex;flex-direction:column}
.e-song b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-song small{font-size:11.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-song>.ico{width:16px;height:16px;opacity:.8;flex:none}
/* the song of the day: Zenly-style card with the artwork blurred behind it */
.np{position:relative;overflow:hidden;border-radius:22px;color:#fff;background:#1d1b22;isolation:isolate;box-shadow:0 10px 30px rgba(20,16,30,.18)}
.np-bg{position:absolute;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(34px) saturate(1.5);opacity:.9;z-index:-1}
.np::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(0,0,0,.02),rgba(0,0,0,.42))}
.np-in{display:flex;align-items:center;gap:14px;padding:16px 46px 10px 16px}
.np-art{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none;box-shadow:0 8px 22px rgba(0,0,0,.35);display:grid;place-items:center}
.np-art .ico{width:30px;height:30px;color:#fff}
.np-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.np-lbl{font-size:11.5px;letter-spacing:.04em;opacity:.85}
.np-tx b{font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.np-tx small{font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
.np-x .ico{width:15px;height:15px}
.np-act{display:flex;gap:8px;padding:8px 12px 12px}
.np-act button,.np-act a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:36px;border-radius:99px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
.np-act button.on{background:#fff;color:#1d1b22}
.np-act .ico{width:15px;height:15px}
.sg-form{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sg-in{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;padding:0 0 0 14px;min-height:50px}
.sg-in+.sg-in{border-top:1px solid var(--line)}
.sg-in label{font-size:14px;color:var(--ink-2)}
.sg-in input{border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:13px 14px 13px 0;outline:none;width:100%}
.sg-in input::placeholder{color:var(--ink-3)}
.sg-res:empty{display:none}
.sg-res{margin-top:8px}
.sg-hint{display:block;font-size:11.5px;color:var(--ink-2);margin:0 2px 2px}
.sg-row{display:grid;grid-template-columns:46px minmax(0,1fr) 28px;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 2px}
.sg-row+.sg-row{border-top:1px solid var(--line)}
.sg-row .art{width:46px;height:46px;border-radius:9px;object-fit:cover;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.sg-row .art .ico,.sg-recent .art .ico{width:18px;height:18px;color:#fff}
.sg-row b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-row small{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-row>i{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.sg-row>i .ico{width:16px;height:16px}
.sg-msg{font-size:12.5px;color:var(--ink-2);padding:8px 2px;margin:0}
.sg-add{width:100%;margin-top:10px}
.sg-lb{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 6px}
.sg-recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sg-recent::-webkit-scrollbar{display:none}
.sg-recent button{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px;max-width:180px}
.sg-recent .art{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none;display:grid;place-items:center}
.sg-recent span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-songs{display:flex;flex-direction:column;gap:8px}
.rp-songs button{display:block;width:100%;text-align:left}
.rp-songs .e-song{margin:0}
.rp-songs .e-song small .num{opacity:1}
/* moves (week of places) */
.mv-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.mv-card>span:nth-child(2){flex:1;min-width:0}
.mv-card b{display:block;font-size:16px;margin-top:2px}
.mv-card small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.mv-mini{width:64px;height:64px;border-radius:16px;flex:none;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.mv-mini svg{width:100%;height:100%}
.mv-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 10px}
.mv-d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 7px;border-radius:14px;font-size:11px;color:var(--ink-2)}
.mv-d b{font-size:15px;color:var(--ink)}
.mv-d i{width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:3px}
.mv-d:disabled{opacity:.35}.mv-d:disabled i{background:var(--line)}
.mv-d[aria-pressed="true"]{background:var(--c);color:#fff}.mv-d[aria-pressed="true"] b{color:#fff}.mv-d[aria-pressed="true"] i{background:#fff}
.mv-map{position:relative;height:min(52vh,380px);border-radius:22px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);background-image:radial-gradient(circle,color-mix(in srgb,var(--ink) 12%,transparent) 1px,transparent 1.5px);background-size:14px 14px}
.mv-map.small{height:200px}
.mv-map img.bt.dk{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.82) saturate(.55)}
.mv-map img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none;animation:mvFade .4s ease both}
@keyframes mvFade{from{opacity:0}}
.mv-map.live{touch-action:none;cursor:grab}
.mv-layer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.mv-layer>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mv-map.still .ln{animation:none;stroke-dashoffset:0}
.mv-map.still img{animation:none}
.mv-zoom{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.16)}
.mv-zoom button{width:38px;height:38px;display:grid;place-items:center;font-size:22px;font-weight:500;color:var(--ink);line-height:1}
.mv-zoom button+button{border-top:1px solid var(--line)}
.mv-zoom .ico{width:18px;height:18px}
.mv-map .halo{fill:none;stroke:var(--surface);stroke-opacity:.85;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mv-map .ln{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:mvDraw 1.2s ease-out forwards}
@keyframes mvDraw{to{stroke-dashoffset:0}}
.mv-map .dot{stroke:#fff;stroke-width:2.5}
.mv-map .now{fill:var(--c);opacity:.35;transform-box:fill-box;transform-origin:center;animation:mvPulse 2s ease-out infinite}
@keyframes mvPulse{from{transform:scale(.6);opacity:.5}to{transform:scale(2.6);opacity:0}}
.mv-pin{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;padding:4px 9px 4px 4px;border-radius:99px;background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;margin-top:-8px}
.mv-pin span{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.mv-pin .ico{width:13px;height:13px}

.pk-chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;color:#fff;flex:none}
