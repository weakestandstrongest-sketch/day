@keyframes wrUp{from{opacity:0;transform:translateY(24px)}}
.wr-k{font-size:14px;font-weight:700;letter-spacing:.14em;opacity:.85;margin:0 0 6px}
.wr-h{font-size:28px;font-weight:700;line-height:1.35;margin:0 0 14px}
.wr-big{font-size:clamp(76px,26vw,120px);font-weight:700;line-height:1;letter-spacing:-.03em;margin:4px 0 10px}
.wr-big small{font-size:28px;margin-left:4px;letter-spacing:0}
.wr-p{font-size:16px;line-height:1.7;margin:4px 0;opacity:.95}
.wr-p b{font-size:20px}
.wr-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.wr-row{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}
.wr-row .n{width:22px;font-size:18px;opacity:.75}
.wr-row .art{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.wr-row .art .ico{width:22px;height:22px;color:#fff}
.wr-row>span:not(.n):not(.art){min-width:0;flex:1}.wr-row .n{flex:none}.wr-row small{display:block;font-size:12.5px;font-weight:500;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-row em{font-style:normal;font-size:13px;opacity:.85}
.wr-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}.wr-bar i{display:block;height:100%;border-radius:6px}
.wr-pix{display:grid;grid-template-columns:22px repeat(31,1fr);gap:2px;font-size:9px;align-items:center;margin-top:6px}
.wr-pix i{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.13)}
.wr-pix i.f{background:transparent}
.wr-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.wr-ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.wr-ph img:nth-child(odd){transform:rotate(-2deg)}.wr-ph img:nth-child(even){transform:rotate(2deg)}
.wr-blob{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:.04em;margin-right:8px;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.wr-btns{display:flex;gap:10px;margin-top:22px}
.wr-btns button{flex:1;height:48px;border-radius:99px;font-weight:700;font-size:15px;background:#fff;color:#2a2340}
.wr-btns button+button{background:rgba(255,255,255,.18);color:#fff}
/* packing list */
.pk-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.pk-row+.pk-row{border-top:1px solid var(--line)}
.pk-row span{flex:1;min-width:0}
.pk-row.on span{color:var(--ink-3);text-decoration:line-through}
.pk-chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;color:#fff;flex:none}
.pk-chk .ico{width:15px;height:15px;stroke-width:3;opacity:0}
.pk-row.on .pk-chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}.pk-row.on .pk-chk .ico{opacity:1}
.pk-rm{color:var(--ink-3);width:28px;height:28px;display:grid;place-items:center}.pk-rm .ico{width:15px;height:15px}
.pk-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pk-sug button{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pk-badge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:11.5px;color:var(--ink-2)}
.pk-badge .ico{width:13px;height:13px}
.pk-badge.ok{color:#2FA36B}
.pk-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin:0 0 12px}
.pk-card h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:15px}
.pk-card h3 .ico{width:18px;height:18px;color:var(--accent)}
.pk-card h3 .sub{margin-left:auto;font-size:12px;color:var(--ink-2);font-weight:500}
.pk-ev+.pk-ev{margin-top:10px}
.pk-ev b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.pk-ev b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pk-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 8px;border-radius:99px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.pk-chip .ico{width:15px;height:15px;stroke-width:3;color:var(--ink-3)}
.pk-chip.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:transparent;color:var(--ink-2);text-decoration:line-through}
.pk-chip.on .ico{color:var(--c)}
/* app lock */
.lock{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 70%);display:flex;align-items:center;justify-content:center;color:var(--ink);user-select:none;-webkit-user-select:none}
.lk-in{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lk-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.lk-ic .ico{width:28px;height:28px}
.lk-t{font-size:19px;margin-top:14px}
.lk-s{font-size:13px;color:var(--ink-2);margin-top:4px;min-height:18px;text-align:center}
.lk-dots{display:flex;gap:16px;margin:22px 0 26px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.lk-dots i.on{background:var(--ink);border-color:var(--ink)}
.lk-dots.err{animation:lkShake .4s}
@keyframes lkShake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px}
.lk-pad button{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:500;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center}
.lk-pad button:active{background:var(--surface-2)}
.lk-pad .ghost{background:transparent;box-shadow:none;font-size:14px;font-weight:700}
.lk-pad .ghost .ico{width:30px;height:30px}
.lk-foot{margin-top:22px;font-size:13.5px;color:var(--accent);font-weight:700}
.lk-warn{text-align:center;font-size:14px;line-height:1.7;margin:18px 0 14px}
.lk-in>.btn{width:100%;margin-bottom:8px}
/* to-do */
.todo{margin:26px 0 8px;scroll-margin-top:70px}
.td-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.td-head h2{margin:0;font-size:22px;display:flex;align-items:baseline;gap:10px}
.td-head .script{font-size:26px}
.td-add{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:700;align-self:center}
.td-add .ico{width:16px;height:16px}
.td-g{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:2px 14px;margin-bottom:10px}
.td-gl{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--ink-2)}
.td-gl span{font-weight:500;color:var(--ink-3)}
.td-g.g-over .td-gl{color:var(--sun)}.td-g.g-today .td-gl{color:var(--accent)}
.td-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.td-row+.td-row{border-top:1px solid var(--line)}
.td-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff}
.td-chk .ico{width:15px;height:15px;stroke-width:3;opacity:0}
.td-row.done .td-chk{background:var(--c)}.td-row.done .td-chk .ico{opacity:1}
.td-row.done b{color:var(--ink-3);text-decoration:line-through}
.td-main{text-align:left;min-width:0}
.td-main b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-main small{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--ink-2);margin-top:2px}
.td-main small>span:not(.td-cls){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.td-cls{display:inline-flex;align-items:center;gap:4px;color:var(--c);font-weight:700}
.td-cls::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.td-prog{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden;max-width:220px}
.td-prog b{display:block;height:100%;border-radius:2px;background:var(--c)}
.td-wait{color:var(--sat);font-weight:700}
.td-due{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.td-due.soon{background:color-mix(in srgb,#EDA04B 18%,var(--surface));color:#C9781F}
.td-due.over{background:color-mix(in srgb,var(--sun) 15%,var(--surface));color:var(--sun)}
.td-done-t{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);padding:6px 4px;margin-bottom:6px}
.td-done-t .ico{width:16px;height:16px}
.td-clear{display:block;margin:6px auto 10px;font-size:12.5px;color:var(--ink-2);text-decoration:underline}
.td-jump{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 0;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;text-align:left}
.td-jump .ico{width:18px;height:18px;color:var(--accent);flex:none}
.td-jump b{flex:1}
.td-jump em{font-style:normal;font-size:12px;font-weight:700;color:var(--sun)}
/* transit (のりかえ) */
.sheet.nk{display:flex;flex-direction:column;padding-bottom:0}
.sheet.nk .sh-bar{flex:none}
.nk-wrap{position:relative;flex:1;display:flex;margin:0 -16px;min-height:0}
.nk-frame{flex:1;width:100%;border:0;background:var(--bg);min-height:0;opacity:0;pointer-events:none;transition:opacity .25s}
.nk-wrap.ready .nk-frame{opacity:1;pointer-events:auto}
.nk-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);color:var(--ink-2);font-size:14px;padding:0 32px;text-align:center;transition:opacity .25s}
.nk-load>b{font-weight:500}
.nk-wrap.ready .nk-load{opacity:0;pointer-events:none}
.nk-spin{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#4F8ED6 16%,var(--surface));color:#4F8ED6;animation:nkBob 1.1s ease-in-out infinite}
.nk-spin .ico{width:26px;height:26px}
@keyframes nkBob{50%{transform:translateY(-6px)}}
.nk-fail{display:none;flex-direction:column;align-items:center;gap:8px}
.nk-fail b{color:var(--ink);font-size:15px}
.nk-fail small{font-size:12.5px;line-height:1.6}
.nk-fail .btn{margin-top:6px;min-width:180px}
.nk-wrap.fail .nk-fail{display:flex}
.nk-wrap.fail .nk-load>b,.nk-wrap.fail .nk-spin{display:none}
.orb-ico{width:22px;height:22px;border-radius:50%;display:block;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 30%),radial-gradient(circle at 30% 68%,#4F7CFF,rgba(79,124,255,0) 72%),radial-gradient(circle at 74% 80%,#2EC5F0,rgba(46,197,240,0) 62%),#1D2447;box-shadow:0 2px 7px rgba(79,124,255,.4),inset 0 -2px 4px rgba(0,0,0,.35)}
.ob-big{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 30%),radial-gradient(circle at 30% 68%,#4F7CFF,rgba(79,124,255,0) 72%),radial-gradient(circle at 74% 80%,#2EC5F0,rgba(46,197,240,0) 62%),#1D2447;box-shadow:0 10px 30px rgba(79,124,255,.45),inset 0 -4px 8px rgba(0,0,0,.35);animation:obPulse 1.6s ease-in-out infinite}
@keyframes obPulse{50%{transform:scale(1.08);box-shadow:0 14px 40px rgba(46,197,240,.55),inset 0 -4px 8px rgba(0,0,0,.35)}}
.nk-wrap.fail .ob-big{display:none}
.bb-ico{width:26px;height:26px;display:block;color:var(--ink)}
.ng-ico{width:23px;height:23px;display:block;border-radius:6px;box-shadow:0 2px 6px rgba(20,48,79,.32)}
.ng-big{width:64px;height:64px;display:block}.ng-big .ng-ico{width:100%;height:100%;border-radius:15px;box-shadow:0 8px 22px rgba(20,48,79,.3);animation:ngFloat 2.4s ease-in-out infinite}
@keyframes ngFloat{50%{transform:translateY(-4px)}}
.bb-ico .dl{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.bb-ico .b1,.bb-ico .b2,.bb-ico .b3{fill:var(--bg);stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.bb-ico .b1,.bb-ico .b2{fill:#F2A93B;stroke:#F2A93B}
.bb-ico .hp{fill:currentColor}
.bb-big{width:64px;height:64px;display:block;color:var(--ink-2)}
.bb-big .bb-ico{width:100%;height:100%;color:var(--ink-2)}
.bb-big .bb-ico .b1,.bb-big .bb-ico .b2,.bb-big .bb-ico .b3{fill:var(--bg);stroke:currentColor;animation:bbRun 1.5s infinite}
.bb-big .bb-ico .b2{animation-delay:.5s}.bb-big .bb-ico .b3{animation-delay:1s}
@keyframes bbRun{0%,30%{fill:#F2A93B;stroke:#F2A93B}40%,100%{fill:var(--bg);stroke:currentColor}}
.nk-wrap.fail .bb-big,.nk-wrap.fail .ng-big{display:none}
.nk-empty{padding:24px 6px;text-align:center;font-size:14px;line-height:1.8;color:var(--ink-2)}
.rt-sum{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.rt-sum .od{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex-wrap:wrap}
.rt-sum .od .ico{width:18px;height:18px;color:var(--ink-3)}
.rt-sum .tm{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.rt-sum .mt{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.rt-tags{display:flex;gap:6px;margin-top:8px}
.rt-tags span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:var(--c)}
.rt-steps{list-style:none;margin:0;padding:6px 16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.rt-steps li{display:grid;grid-template-columns:48px 18px minmax(0,1fr);gap:10px;align-items:stretch}
.rt-steps .t{font-size:12.5px;text-align:right;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.rt-steps .t b{font-size:14.5px;color:var(--ink)}
.rt-steps .mk{position:relative;display:flex;justify-content:center}
.rt-steps .st .mk::after{content:"";align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);z-index:1}
.rt-steps .st.first .mk::after,.rt-steps .st.last .mk::after{border-color:var(--accent);background:var(--accent)}
.rt-steps .st .nm{font-size:16px;font-weight:700;padding:12px 0;align-self:center}
.rt-steps .ac .mk::before{content:"";width:6px;border-radius:3px;background:var(--c,var(--accent))}
.rt-steps .ac.walk .mk::before{width:0;border-left:4px dotted var(--ink-3);background:none}
.rt-steps .ac .bd{padding:6px 0 10px;font-size:13px;color:var(--ink-2)}
.rt-steps .ac .ln{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.rt-steps .ac .ln::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.rt-steps .ac.walk .ln::before{display:none}
.rt-steps details{margin-top:4px}
.rt-steps summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px}
.rt-steps details li{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
.rt-acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tl-route{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--accent)}
.tl-route .ico{width:13px;height:13px}
/* leave-time hint */
.tl-leave{display:flex;align-items:center;gap:8px;width:calc(100% - 64px);margin:2px 0 6px 64px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,#4F8ED6 12%,var(--surface));color:var(--ink);font-size:12.5px;text-align:left}
.tl-leave .ico{width:17px;height:17px;color:#4F8ED6;flex:none}
.tl-leave b{font-size:14px}
.tl-leave small{color:var(--ink-2)}
.tl-leave.past{opacity:.55}
.tl-leave.err{background:var(--surface-2);color:var(--ink-2)}
.ev-leave{margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#4F8ED6 12%,var(--surface));font-size:13px;line-height:1.6}
.ev-leave b{font-size:15px}
.td-plan{display:inline-flex;align-items:center;gap:3px;color:#4F8ED6;font-weight:700}
.td-plan .ico{width:12px;height:12px}
.td-hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:0 0 10px}
/* today */
.td-hello{margin:6px 2px 14px}
.td-hello .script{font-size:30px}
.td-hello h2{margin:2px 0 0;font-size:26px}
.td-hello small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.tw{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;color:#fff;background:linear-gradient(150deg,var(--wa),var(--wb));margin-bottom:12px;width:100%;text-align:left}
.tw>.ico{width:42px;height:42px;stroke-width:1.5;flex:none}
.tw b{font-size:34px;font-weight:300;line-height:1}
.tw span{font-size:13px;line-height:1.5}
.tw span small{display:block;opacity:.85}
.tnext{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;border-left:6px solid var(--c)}
.tnext small{font-size:12px;color:var(--ink-2);font-weight:700}
.tnext b{display:block;font-size:19px;margin:2px 0}
.tnext .in{font-size:13px;color:var(--accent);font-weight:700}
.tlist{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:4px 16px;margin-bottom:12px}
.tlist h3{font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.trow{display:grid;grid-template-columns:52px 10px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;font-size:14.5px;width:100%;text-align:left}
.trow+.trow{border-top:1px solid var(--line)}
.trow .t{font-size:13px;color:var(--ink-2);text-align:right}
.trow i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.trow.done span:last-child{color:var(--ink-3);text-decoration:line-through}
.trow.now span:last-child{font-weight:700}
.qi{text-align:center;padding:6px 6px 4px}
.qi .script{font-size:28px}
.qi h2{font-size:26px;margin:6px 0 2px}
.qi .yomi{font-size:13px;color:var(--ink-2)}
.qi .src{display:inline-block;margin-top:8px;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.qi-box{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px;text-align:left;font-size:15px;line-height:1.8}
.qi-box b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.pring{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:6px auto 4px}
.pring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.pring circle{fill:none;stroke-linecap:round}
.pring .trk{stroke:color-mix(in srgb,var(--ink) 7%,transparent);stroke-width:11}
.pring .prj{stroke:var(--pay);stroke-opacity:.26;stroke-width:11}
.pring .dn{stroke:var(--pay);stroke-width:11}
.pring .prj,.pring .dn{stroke-dasharray:100 100;stroke-dashoffset:var(--o);animation:pringIn 1s cubic-bezier(.3,.7,.2,1) both}
.pring .dn{animation-delay:.15s}
@keyframes pringIn{from{stroke-dashoffset:100}}
.pring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.pring .lg{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.pring .lg i{width:9px;height:9px;border-radius:50%;background:var(--pay)}
.pring .lg i.p{background:color-mix(in srgb,var(--pay) 30%,transparent)}
.pring .big{font-size:clamp(28px,9vw,36px);font-weight:700;line-height:1.15;letter-spacing:.01em}
.pring .dnv{font-size:15px;font-weight:700;color:var(--pay)}
.pring .msg{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.pgoal{display:flex;align-items:center;gap:6px;margin:0 auto;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pgoal b{color:var(--pay);font-size:15px}
.pgoal .ico{width:15px;height:15px;color:var(--pay)}
.ptop{display:flex;flex-direction:column;align-items:center;gap:6px}
.pback{font-size:12.5px;color:var(--pay);font-weight:700;padding:2px 8px}
.pstats{display:flex;justify-content:center;gap:22px;margin:8px 0 2px;align-items:baseline}
.pstats span{font-size:12px;color:var(--ink-2)}
.pstats b{font-size:20px;margin-left:5px;color:var(--ink)}
.ptab{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.ptab th{font-weight:500;color:var(--ink-2);font-size:11.5px;text-align:right;padding:4px 0 8px}
.ptab td{padding:9px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ptab td:first-child,.ptab th:first-child{text-align:left;white-space:normal;font-weight:700}
.ptab td.g{color:var(--pay);font-weight:700}
.ptab tr.sum td{font-weight:700}
.pay-card .mring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.pay-card .mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.pay-card .mring .trk{stroke:color-mix(in srgb,var(--ink) 7%,transparent)}
.pay-card .mring .prj{stroke:var(--pay);stroke-opacity:.24}
.pay-card .mring .dn{stroke:var(--pay)}
.pay-card .pay-meta .g{color:var(--pay);font-weight:700}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter.over i{background:var(--sun)}
button.set-row{width:100%;text-align:left}
button.set-row .ico{width:18px;height:18px;color:var(--ink-3)}
/* school */
.tt{display:grid;gap:4px}
.tt-h{font-size:12px;color:var(--ink-2);text-align:center;padding:2px 0}
.tt-h.now{color:var(--accent);font-weight:700}
.tt-p{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1.15}
.tt-p small{font-size:8.5px;color:var(--ink-3);font-weight:400}
.tt-cell{min-height:60px;border-radius:10px;padding:5px 4px;font-size:11px;font-weight:700;line-height:1.25;text-align:left;background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c);overflow:hidden;overflow-wrap:anywhere;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.tt-cell small{font-size:9.5px;font-weight:400;color:var(--ink-2);margin-top:2px}
.tt-cell.empty{background:var(--surface);border:1px dashed var(--line);color:var(--ink-3);align-items:center;justify-content:center;font-size:16px;font-weight:400}
.att{width:40px;height:30px;border-radius:9px;font-size:11.5px;font-weight:700;justify-self:center;border:1.5px solid var(--line);color:var(--ink-3)}
.att.present{background:#4E9F72;border-color:#4E9F72;color:#fff}
.att.late{background:#DE8E2A;border-color:#DE8E2A;color:#fff}
.att.absent{background:#C9574F;border-color:#C9574F;color:#fff}
.att.cancel{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
.tl-item.cancel .tt{text-decoration:line-through;color:var(--ink-3)}
.tl-item.cancel .pill{background:var(--surface);color:var(--c);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent);opacity:.8}
.tl-item.cancel .pill::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:currentColor;transform:rotate(-35deg);border-radius:1px}
.att-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.att-row:first-child{border-top:0}
.att-row b{display:flex;align-items:center;gap:6px;font-size:14px}
.att-row b i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.att-row small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.left{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);white-space:nowrap}
.left.warn{background:color-mix(in srgb,var(--sun) 18%,var(--surface));color:var(--sun)}
.due{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);white-space:nowrap}
.due.soon{background:color-mix(in srgb,var(--hol) 24%,var(--surface))}
.due.over{background:color-mix(in srgb,var(--sun) 20%,var(--surface));color:var(--sun)}
.hw{display:grid;grid-template-columns:30px minmax(0,1fr) auto 32px;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 6px 8px 12px}
.hw .chk{--c:var(--accent);width:26px;height:26px}
.hw .tt2{font-size:15px;overflow-wrap:anywhere;min-width:0}
.hw .tt2 small{display:block;font-size:11.5px;color:var(--ink-2)}
.hw.done .tt2{color:var(--ink-3);text-decoration:line-through}
.hw .del{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3)}
.hw .del .ico{width:16px;height:16px}
.hw-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.hw-form>:first-child,.hw-form>button{grid-column:1/-1}
.slot-list{display:flex;flex-wrap:wrap;gap:6px}
.slot-list span small{font-size:10.5px;color:var(--ink-2);margin-left:2px}
.term-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 12px;padding-bottom:2px}
.term-row::-webkit-scrollbar{display:none}
.term-row .chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.term-row .chip i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.term-row .chip.add{color:var(--ink-2);border-style:dashed}
.term-row .chip .ico{width:14px;height:14px}
.term-info{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--ink-2);margin:12px 2px 0;line-height:1.6}
.term-info b{color:var(--ink)}
.term-info button{color:var(--accent);font-weight:700;flex:none;padding:2px 0}
.term-card{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tc-h{display:flex;align-items:center;gap:8px}
.tc-h b{font-size:15.5px}
.tc-h small{margin-left:auto;font-size:12px;color:var(--ink-2)}
.tc-now{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:1px 8px}
.tc-r{font-size:13px;color:var(--ink-2)}
.tc-b{display:flex;flex-wrap:wrap;gap:6px}
.tc-b i{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:99px;padding:3px 10px 3px 7px;background:color-mix(in srgb,#E9A23B 16%,var(--surface-2));color:var(--ink)}
.tc-b .ico{width:13px;height:13px;color:#E9A23B}
.sd-add,.br-add,.co-mv{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.br-add .chips .chip{padding:5px 12px;font-size:12.5px}
.set-row .ico{width:15px;height:15px;display:inline;vertical-align:-2px;color:#E9A23B}
.co-head{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px;border-left:4px solid var(--c)}
.co-head .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);flex:none}
.co-head b{display:block;font-size:17px}
.co-head small{display:block;font-size:12.5px;color:var(--ink-2)}
.co-st{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding:8px 12px}
.co-st.off{color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line)}
.cl-tag{font-weight:700;color:var(--accent)}
.tl-item.cancel .cl-tag{color:var(--ink-2)}
.tl-item.extra .pill{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent)}
.slot-list span{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 6px 5px 12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.slot-list button{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3)}
.slot-list .ico{width:14px;height:14px}
.slot-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:8px}
.slot-add .inp{min-height:40px;padding:8px 10px}
.slot-add button{padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.per-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.per-row b{text-align:center;font-size:13px}
.per-row .inp{min-height:40px;padding:6px 10px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist div:first-child{border-top:0}
.hist .att{width:auto;height:auto;padding:3px 10px}
.tl-title{text-align:left}
/* year in pixels */
.pixels{display:grid;grid-template-columns:18px repeat(12,minmax(0,1fr));gap:2px}
.px{height:10px;border-radius:2px;background:var(--surface-2)}
.px.on{cursor:pointer}
.px.x{background:transparent}
.px.fut{opacity:.45}
.px-h,.px-d{font-size:9px;color:var(--ink-3);text-align:center;line-height:10px}
.px-h{line-height:14px}
/* focus timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 20px}
.tm-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-align:center;max-width:100%}
.tm-title i{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tm-title .ico{width:18px;height:18px}
.ring{position:relative;width:240px;height:240px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--c);transition:stroke-dashoffset 1s linear}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-size:46px;font-weight:700;line-height:1}
.ring .ctr small{font-size:12.5px;color:var(--ink-2);margin-top:10px;padding:0 24px}
.ring .ctr small.over{color:var(--sun);font-weight:700}
.timer .row2{width:100%}
.timer-start{width:100%;margin-bottom:14px}
#timerChip{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px)}
#timerChip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;animation:pulse 1.6s ease-in-out infinite}
#timerChip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.35}}
.tl-item.running .pill{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
/* Structured-style task editor */
.sheet.tk{padding-top:0;padding-bottom:0}
.tk-head{position:relative;margin:0 -16px;padding:16px 20px 26px;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),var(--c);color:#fff;touch-action:none}
.tk-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);margin:-6px auto 10px}
.tk-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff}
.tk-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:20px}
.tk-icon{position:relative;display:block}
.tk-icon .sq{width:78px;height:78px;border-radius:20px;background:#3A3A3C;border:3px solid #fff;display:grid;place-items:center;color:var(--c)}
.tk-icon .sq .ico{width:34px;height:34px;stroke-width:2.1}
.tk-icon .pal{position:absolute;left:-10px;bottom:-10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);color:#fff}
.tk-icon .pal .ico{width:20px;height:20px}
.tk-tt{min-width:0}
.tk-tt small{display:flex;align-items:center;gap:5px;font-size:12.5px;opacity:.9;margin-bottom:2px}
.tk-tt small .ico{width:15px;height:15px}
.tk-tt input{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.55);color:#fff;font-size:22px;font-weight:700;padding:4px 0 6px;border-radius:0}
.tk-tt input:focus,.tk-tt input:focus-visible{outline:none;border-bottom-color:#fff}
.tk-tt input::placeholder{color:rgba(255,255,255,.65)}
.tk-done{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;color:var(--c)}
.tk-done .ico{width:18px;height:18px;stroke-width:3;opacity:0}
.tk-done.on{background:#fff}
.tk-done.on .ico{opacity:1}
.tk-sec{font-size:15px;font-weight:700;color:var(--ink-2);margin:20px 6px 10px}
.sugg{background:var(--surface);border-radius:22px;padding:2px 0;box-shadow:var(--shadow)}
.sugg button{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;width:100%;text-align:left}
.sugg .ic{display:grid;place-items:center;color:var(--c)}
.sugg .ic .ico{width:26px;height:26px;stroke-width:2}
.sugg .tx{padding:12px 16px 12px 0;border-top:1px solid var(--line)}
.sugg button:first-child .tx{border-top:0}
.sugg small{display:block;font-size:12.5px;color:var(--ink-2)}
.sugg b{font-size:16.5px}
.tk-body{display:flex;flex-direction:column;gap:12px;padding-top:20px}
.tk-row{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border-radius:999px;padding:15px 20px;font-size:17px;text-align:left}
.tk-row span{flex:1}
.tk-row>.ico:first-child{color:var(--c);width:24px;height:24px}
.tk-row>.ico:last-child{color:var(--ink-3);width:18px;height:18px}
.tk-durs{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.tk-durs .chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tk-chips{display:flex;gap:8px;flex-wrap:wrap}
.tk-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:12px 18px;font-size:15.5px}
.tk-chip .ico{width:20px;height:20px}
.tk-chip.on{background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.tk-chip.ghost{background:transparent;color:var(--ink-2);padding:12px 8px}
.tk-card{background:var(--surface);border-radius:22px;padding:4px 16px 10px}
.stk{display:grid;grid-template-columns:26px minmax(0,1fr) 28px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.stk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;color:#fff}
.stk .box .ico{width:14px;height:14px;stroke-width:3;opacity:0}
.stk.on .box{background:var(--c);border-color:var(--c)}
.stk.on .box .ico{opacity:1}
.stk.on>span{color:var(--ink-3);text-decoration:line-through}
.stk .rm{color:var(--ink-3);display:grid;place-items:center;width:28px;height:28px}
.stk .rm .ico{width:16px;height:16px}
.stk.add{grid-template-columns:26px minmax(0,1fr)}
.stk input{border:0;background:transparent;font-size:16px;padding:2px 0;color:var(--ink);min-width:0}
.stk input:focus,.stk input:focus-visible{outline:none}
.tk-card textarea{display:block;width:100%;border:0;background:transparent;resize:none;min-height:120px;padding:12px 0 0;font-size:16px;line-height:1.6;color:var(--ink)}
.tk-card textarea:focus,.tk-card textarea:focus-visible{outline:none}
.tk-del{color:var(--sun);font-size:14px;font-weight:700;padding:8px;align-self:center}
.tk-foot{position:sticky;bottom:0;padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:14px;background:linear-gradient(transparent,var(--bg) 30%)}
.tk-go{width:100%;min-height:58px;border-radius:999px;background:var(--c);color:#fff;font-size:17px;font-weight:700;box-shadow:none}
.tk-go:disabled{opacity:.45}
/* event editor (Structured style) */
.tk-more{position:absolute;right:20px;top:25px}
.tk-more .ico{width:24px;height:24px;stroke-width:2.6}
.tk-icon .sq.cap{width:74px;height:124px;border-radius:37px}
.tk-rep{display:inline-flex;margin-top:8px;opacity:.85}
.tk-rep .ico{width:18px;height:18px}
.ev-list{background:var(--surface);border-radius:22px;overflow:hidden}
.ev-li{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 18px;text-align:left;font-size:16.5px}
.ev-list>*+.ev-li::before{content:"";position:absolute;left:56px;right:0;top:0;border-top:1px solid var(--line)}
.ev-li>.ico:first-child{width:24px;height:24px;color:var(--c);flex:none}
.ev-li>span{flex:1;min-width:0}
.ev-show>span{display:flex;flex-direction:column;gap:8px}
.ev-show .seg{display:flex;align-self:stretch}
.ev-show .seg button{flex:1;font-size:13px;padding:6px 4px}
.ev-li>span small{display:block;font-size:12px;color:var(--ink-2)}
.ev-li em{font-style:normal;color:var(--ink-2);font-size:14.5px;white-space:nowrap}
.ev-li>.ico:last-child{width:18px;height:18px;color:var(--ink-3);flex:none}
.ev-x{padding:2px 18px 14px 56px;min-width:0}
.dt-grid{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.dt-grid.t{grid-template-columns:32px minmax(0,1.3fr) minmax(0,1fr)}
.dt-l{font-size:12.5px;color:var(--ink-2)}
.dt-grid .inp{min-height:44px;padding:9px 10px;font-size:16px}
@media (max-width:389px){.ev-x{padding-left:20px}}
.ev-x .fld{margin-bottom:10px}
.sw-in{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.sw-in::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-in:checked{background:var(--c)}
.sw-in:checked::after{transform:translateX(20px)}
.ev-x .toggle{background:transparent;border:0;padding:4px 0;min-height:40px}
.ev-del{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:999px;background:var(--surface);color:var(--sun);font-weight:700;font-size:16px}
.ev-del .ico{width:20px;height:20px}
.choice .btn .ico{width:20px;height:20px}
/* focus timer — full screen, standby-clock style */
.sheet.fs{max-width:none;max-height:none;height:100%;border-radius:0;padding:0;background:#0b0b10;overflow:hidden}
.tm-fs{position:relative;height:100%;display:flex;flex-direction:column;color:#fff;overflow:hidden;background:var(--tbg,#0b0b10);--dfont:var(--f-body);--dw:700}
.tm-art{position:absolute;inset:-25%;filter:blur(46px) saturate(150%);pointer-events:none}
.tm-art i{position:absolute;width:62%;height:62%;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.tm-art i:nth-child(1){background:var(--t1);left:2%;top:4%}

.mn-chip{flex:none;font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.mn-date{display:flex;align-items:center;gap:4px}

.mn-dl{position:relative;padding:4px 8px;border-radius:10px;background:var(--surface-2)}

.mn-editbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mn-pad{position:sticky;bottom:0;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px -16px 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.mn-pad button{height:42px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow);font-size:20px;font-weight:500;color:var(--ink);touch-action:manipulation;font-variant-numeric:tabular-nums}
.mn-pad button:active{transform:scale(.95);background:var(--surface-2)}
.mn-pad .op{color:var(--accent);font-weight:700}
.mn-pad .fn{color:var(--ink-2);font-size:17px}
.mn-pad .save{grid-column:span 2;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700}
.mn-nav{margin-top:0}
.mn-nav .rp-title{text-align:center}.mn-nav .rp-title h2{margin:0;font-size:19px}.mn-nav .rp-title small{font-size:11.5px;color:var(--ink-2)}
.mn-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mn-sum>div{display:flex;flex-direction:column;align-items:center;gap:2px}

.mn-sum b{font-size:17px}
.mn-sum p{grid-column:1/-1;margin:6px 0 0;font-size:12px;color:var(--ink-2);text-align:center}
.mn-dayh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 6px;font-size:12.5px;color:var(--ink-2);font-weight:700}
.mn-dayh i{font-style:normal;margin-left:8px;color:var(--exp)}.mn-dayh i.inc{color:var(--inc)}
.mn-list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.mn-dd .mn-list,.mn-list.in{box-shadow:none;background:transparent;border-radius:0}
.mn-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left;font-size:14.5px}
.mn-item+.mn-item{border-top:1px solid var(--line)}
.mn-dd .mn-item{padding:8px 2px}
.mn-item>i{width:9px;height:9px;border-radius:50%;flex:none}
.mn-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-item .t small{color:var(--ink-2);font-size:13px}
.mn-item .t small.d{margin-right:6px}
.mn-item .t em{font-style:normal;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:1px}
.mn-item b{flex:none;font-weight:600}
.mn-item.err .t{color:var(--sun);font-size:12.5px}
.mn-gseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.mn-gseg button{padding:7px 0;border-radius:99px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.mn-gseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.mn-chart{display:grid;place-items:center;padding:18px}
.mn-donut{position:relative;width:min(220px,62vw);aspect-ratio:1}

.mn-donut .c small{font-size:12px;color:var(--ink-2)}.mn-donut .c b{font-size:21px}
.mn-crows{padding:8px 14px}
.mn-crow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0 4px;text-align:left;font-size:14.5px}
.mn-crow>i{width:10px;height:10px;border-radius:50%;flex:none}
.mn-crow .t{flex:1;min-width:0}
.mn-crow small{font-size:12px;color:var(--ink-2)}
.mn-crow .ico{width:15px;height:15px;color:var(--ink-3);transition:transform .2s}
.mn-crow[aria-expanded="true"] .ico{transform:rotate(180deg)}
.mn-cbar{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin:0 0 6px 20px;overflow:hidden}
.mn-cbar i{display:block;height:100%;border-radius:2px}
.mn-list.in{margin:0 0 8px 20px}.mn-list.in .mn-item{padding:8px 0}
.mn-save{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.mn-save small{font-size:12px;color:var(--ink-2)}.mn-save>b{font-size:28px}
.mn-bars{width:100%;margin-top:12px}
.mn-bars line{stroke:var(--line);stroke-width:1}
.mn-bars text{font-size:9px;fill:var(--ink-2)}
.mn-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.mn-tab th{font-weight:500;color:var(--ink-2);font-size:11px;text-align:right;padding:0 0 6px}
.mn-tab th:first-child,.mn-tab td:first-child{text-align:left}
.mn-tab td{text-align:right;padding:7px 0;border-top:1px solid var(--line)}
.mn-tab tr.cur td{font-weight:700}
.mn-tab td.neg,.mn-bud .neg{color:var(--sun)} .mn-bud .pos{color:var(--pay)}
.mn-bud-top{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.mn-bud-top small{display:block;font-size:11.5px;color:var(--ink-2)}.mn-bud-top b{font-size:18px}
.mn-per{margin:4px 0 0;text-align:center;font-size:13px;color:var(--ink-2)}.mn-per b{color:var(--ink);font-size:15px}
.mn-bc{display:grid;grid-template-columns:1fr auto;align-items:center;font-size:13.5px;margin-top:8px}
.mn-bc .t{display:flex;align-items:center;gap:7px}.mn-bc .t i{width:9px;height:9px;border-radius:50%}
.mn-bc .num{font-size:12px;color:var(--ink-2)}.mn-bc .meter{grid-column:1/-1;height:7px;margin:5px 0 0}
.mn-catlist{display:flex;flex-direction:column;gap:6px}
.mn-ce{display:flex;align-items:center;gap:4px}
.mn-ce .inp{flex:1;min-width:0;min-height:42px;padding:8px 12px}
.mn-ce>button:not(.mn-sw){width:34px;height:40px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.mn-ce>button:disabled{opacity:.25}
.mn-ce>button[data-n="-1"] .ico{transform:rotate(90deg)}.mn-ce>button[data-n="1"] .ico{transform:rotate(90deg)}
.mn-ce>button.del{color:var(--sun)}
.mn-ce .ico{width:17px;height:17px}
.mn-sw{width:28px;height:28px;border-radius:50%;background:var(--c);flex:none;margin-right:4px;box-shadow:inset 0 0 0 2px color-mix(in srgb,#fff 35%,transparent)}
.mn-sel{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:15px;color:var(--ink)}
.mn-fx span{display:flex;align-items:center;gap:7px}.mn-fx i{width:9px;height:9px;border-radius:50%}
.mn-fx b{font-weight:600;font-size:14px;margin-right:6px}
.mn-blist{display:flex;flex-direction:column;gap:6px}
.mn-brow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.mn-brow span{display:flex;align-items:center;gap:7px}.mn-brow i{width:9px;height:9px;border-radius:50%}
.mn-brow .inp{width:130px;text-align:right;min-height:42px;padding:8px 12px}
.mn-maps{display:flex;flex-direction:column;gap:6px}
.mn-bh{margin:6px 2px 8px;font-size:13px;font-weight:700;color:var(--ink)}.mn-bh small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.mn-gcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px;margin-bottom:10px}
.mn-grow{display:flex;gap:6px;align-items:center}
.mn-grow .inp{min-height:42px;padding:8px 12px}.mn-grow .inp:first-child{flex:1;min-width:0}.mn-grow .inp.num{width:110px;flex:none;text-align:right}
.mn-grow .del{width:36px;height:40px;display:grid;place-items:center;color:var(--sun);flex:none}.mn-grow .del .ico{width:17px;height:17px}
.mn-gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mn-gchip{font-size:12.5px;padding:5px 11px 5px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.mn-gchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mn-gchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);font-weight:700}
.mn-bg .t{gap:6px}.mn-bg .dots{display:inline-flex;gap:2px}.mn-bg .dots i{width:7px;height:7px;border-radius:50%}
.mn-bg .mem{grid-column:1/-1;font-size:11px;color:var(--ink-2);margin-top:3px}.mn-bg .mem .neg{color:var(--sun)}
.mn-acc0 p{margin:0 0 12px;font-size:14px;line-height:1.7}.mn-acc0 small{color:var(--ink-2);font-size:12px}
.mn-qa{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mn-qa .mn-chip{color:var(--accent);font-weight:700}
.mn-swrow{display:flex;flex-wrap:wrap;gap:10px}
.mn-swrow .mn-sw{width:32px;height:32px;margin:0}
.mn-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.mn-big{font-size:24px;font-weight:700;text-align:right}
.mn-crow .t small.d{font-size:11px;color:var(--ink-3)}
.mn-crow .neg{color:var(--sun)}
.mn-spark{width:100%;height:70px}.mn-spark path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.mn-spark circle{fill:var(--accent)}
.mn-map{display:grid;grid-template-columns:7.5em minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.mn-map .inp{min-height:40px;padding:6px 10px;font-size:15px}

/* ---- メモ（あとで） ---- */
.ib-seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;margin:0 0 12px}
.ib-seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink-2)}
.ib-seg button .ico{width:16px;height:16px}
.ib-seg button small{font-size:11px;background:var(--surface-2);border-radius:99px;padding:0 7px;color:var(--ink-2)}
.ib-seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ib-seg button[aria-selected="true"] small{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.nt-top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.nt-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px;color:var(--ink-3)}
.nt-search .ico{width:17px;height:17px;flex:none}
.nt-search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:8px 0;color:var(--ink);outline:none}
.nt-new{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.nt-new .ico{width:20px;height:20px}
.nt-gh{display:flex;align-items:center;gap:5px;margin:16px 4px 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.nt-gh .ico{width:14px;height:14px;color:var(--accent)}
.nt-row{display:block;padding:0}
.nt-main{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;min-width:0}
.nt-ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:20px;background:var(--surface-2);color:var(--ink-3)}
.nt-ic .ico{width:18px;height:18px}
.nt-tx{flex:1;min-width:0}
.nt-tx b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-tx small{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.nt-tx small .num{color:var(--ink);margin-right:8px;font-weight:600}
.nt-tx small i{font-style:normal;color:var(--ink-3)}
.nt-todo{flex:none;display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:99px;padding:3px 8px}
.nt-todo .ico{width:12px;height:12px}.nt-todo.all{color:var(--pay)}
.nt-empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.nt-empty>.ico{width:40px;height:40px;color:var(--accent);opacity:.6}
.nt-empty p{font-size:14px;line-height:1.8;margin:10px 0 18px}
.sheet.nt{background:var(--surface)}
.sheet.nt .sh-bar{background:var(--surface)}
.nt-bar .l{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600}
.nt-bar .l .ico{width:20px;height:20px}
.nt-acts{display:flex;gap:4px}
.nt-acts button{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.nt-acts button .ico{width:20px;height:20px}
.nt-acts button[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nt-page{padding:4px 6px 160px}
.nt-icon{font-size:44px;line-height:1;padding:2px 0;margin:4px 0 2px}
.nt-icon.none{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:4px;padding:4px 0}
.nt-icon.none .ico{width:14px;height:14px}
.nt-title{width:100%;border:0;background:transparent;resize:none;font-size:27px;font-weight:700;line-height:1.3;color:var(--ink);padding:0;overflow:hidden;outline:none;font-family:inherit}
.nt-title::placeholder{color:var(--ink-3)}
.sheet.nt textarea:focus,.sheet.nt textarea:focus-visible,.sheet.nt input:focus,.sheet.nt input:focus-visible,.nt-icon:focus,.nt-icon:focus-visible,.nb-hrb:focus,.nb-hrb:focus-visible,.nt-tail:focus,.nt-tail:focus-visible{outline:none;box-shadow:none} /* a page to write on: no input boxes */
.nt-meta{font-size:12px;color:var(--ink-3);margin:6px 0 14px}
.nb{display:flex;align-items:flex-start;gap:6px;position:relative}
.nb-tx{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;color:var(--ink);font-family:inherit;font-size:16px;line-height:1.65;padding:3px 0;overflow:hidden}
.nb-tx::placeholder{color:transparent}
.nb-tx:focus::placeholder{color:var(--ink-3)}
.nb-h1 .nb-tx{font-size:22px;font-weight:700;line-height:1.4;padding-top:12px}
.nb-h2 .nb-tx{font-size:18.5px;font-weight:700;line-height:1.45;padding-top:8px}
.nb-pre{flex:none;width:20px;text-align:center;font-size:16px;line-height:1.65;padding-top:3px;color:var(--ink-2)}
.nb-ul .nb-pre{font-size:20px;line-height:1.3;color:var(--accent)}
.nb-ol .nb-pre{font-size:14.5px;color:var(--accent);font-weight:700}
.nb-chk{flex:none;width:22px;height:22px;margin:5px 2px 0 0;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.nb-chk .ico{width:14px;height:14px;stroke-width:3}
.nb-chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.nb-todo.done .nb-tx{color:var(--ink-3);text-decoration:line-through}
.nb-quote{border-left:3px solid var(--accent);padding-left:12px;margin:4px 0}
.nb-quote .nb-tx{color:var(--ink-2)}
.nb-hrb{display:block;width:100%;padding:10px 0}.nb-hrb hr{border:0;border-top:1.5px solid var(--line);margin:0}
.nt-tail{display:block;width:100%;height:120px}
.nt-tools{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.sheet.nt.editing .nt-tools{display:flex}
.nt-tools button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:46px;border-radius:12px;color:var(--ink);touch-action:manipulation}
.nt-tools button span{font-size:16px;font-weight:700;line-height:1.1}.nt-tools button span .ico{width:17px;height:17px}
.nt-tools button small{font-size:9.5px;color:var(--ink-2);margin-top:2px}
.nt-tools button:active{background:var(--surface-2)}
.nt-tools .kb{margin-left:auto;color:var(--ink-2)}.nt-tools .kb .ico{width:20px;height:20px}
.nt-icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:12px}
.nt-icons button{aspect-ratio:1;border-radius:14px;background:var(--surface);font-size:28px;display:grid;place-items:center}
.nt-icons button:first-child{font-size:13px;color:var(--ink-2)}
.nt-icons button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
/* ---- 灯 (habits) ---- */
.hb-ico{width:23px;height:23px;display:block;border-radius:6px;box-shadow:0 2px 6px rgba(238,106,58,.35)}
.hb-btn{position:relative}
.hb-btn.run::after{content:"";position:absolute;top:7px;right:4px;width:8px;height:8px;border-radius:50%;background:#EE6A3A;box-shadow:0 0 0 2px var(--bg);animation:hbPulse 1.6s ease-in-out infinite}
@keyframes hbPulse{50%{opacity:.35}}
.sheet.hb{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden}
.sheet.hb .sh-bar,.sheet.hbd .sh-bar.hb-bar{padding-left:16px;padding-right:16px}
.hb-bar{grid-template-columns:auto 1fr auto}
.sheet.hbd .hb-bar{padding-left:0;padding-right:0}
.hb-round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hb-round .ico{width:22px;height:22px}
.hb-round.add{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hb-round.add .ico{stroke-width:2.4}
.hb-ttl{justify-self:center;font-size:17px;font-weight:700;color:var(--ink);padding:6px 10px}
.hb-tools{justify-self:end;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.hb-tools button{width:42px;height:38px;display:grid;place-items:center;color:var(--ink);border-radius:999px}
.hb-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
.hb-pad{height:150px}
.hb-foot{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 35%,transparent)}
.hb-foot>*{pointer-events:auto}
.hb-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.hb-tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--ink-2);padding:6px 0 5px;border-radius:999px}
.hb-tabs button[aria-current="page"]{color:var(--accent);background:var(--glass-sel)}
.hb-tabs .ico{width:22px;height:22px}
.hb-mini{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);cursor:pointer}
.hb-mini .hb-tx{flex:1}
.hb-mini-t{font-size:26px;font-weight:600;letter-spacing:.01em}

.hb-b{display:flex;align-items:center;justify-content:center;gap:6px;height:54px;border-radius:999px;font-size:16px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}

.hb-b.pri .ico{fill:currentColor;stroke-width:1.5}

.hbd-cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px 12px;text-align:left}
.hbd-mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

.hbd-mh button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}

.hbd-dow,.hbd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.hbd-dow{font-size:11px;color:var(--ink-2);margin-bottom:5px}
.hb-cd{aspect-ratio:1;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:color-mix(in srgb,var(--c) 14%,transparent)}
.hb-cd.part{background:color-mix(in srgb,var(--c) calc(25% + var(--f) * 40%),transparent);color:var(--ink)}
.hb-cd.on{background:var(--c);color:#fff}
.hb-cd.rest{background:transparent;border:1px dashed color-mix(in srgb,var(--c) 30%,transparent)}
.hb-cd.sk{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 25%,transparent) 0 4px,transparent 4px 8px)}
.hb-cd.fut{background:transparent;color:var(--ink-3)}
.hb-cd.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.hbd-foot{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:13px;color:var(--ink-2)}
.hbd-foot span{display:inline-flex;align-items:center;gap:4px}
.hbd-foot .ico{width:16px;height:16px}
.hbd-foot b{color:var(--ink);font-size:15px}
.hbd-kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hbd-kvs div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.hbd-kvs small{display:block;font-size:11.5px;color:var(--ink-2)}
.hbd-kvs b{font-size:20px}
.hbd-since{font-size:12px;color:var(--ink-3);margin:14px 0 0}

.hb-save{font-weight:700;color:var(--accent)}
.hbe-top{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.hbe-emo{flex:none;width:64px;height:64px;border-radius:20px;background:color-mix(in srgb,var(--c) 24%,var(--surface));border:2px solid var(--c);display:grid;place-items:center}
.hbe-emo input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:32px;padding:0;outline:none;caret-color:transparent}
.hbe-name{flex:1;font-size:18px;font-weight:700}
.hbe-emos{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.hbe-emos button{width:40px;height:40px;border-radius:12px;font-size:21px}
.hbe-emos button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.hbe-lb{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 2px 8px}
.hbe-cols{display:flex;flex-wrap:wrap;gap:10px}
.hbe-cols button{width:34px;height:34px;border-radius:50%;background:var(--c)}
.hbe-cols button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.hbe-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hbe-kinds button{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:center}
.hbe-kinds b{font-size:14.5px}
.hbe-kinds small{font-size:11px;color:var(--ink-2)}
.hbe-kinds button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.hbe-goal{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.hbe-goal>span:first-child{flex:1;font-size:14px;font-weight:600}
.hbe-goal button{width:38px;height:38px;border-radius:50%;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--accent)}
.hbe-goal .inp{width:70px;text-align:center;padding:8px 4px;font-weight:700}

.hbe-goal .u{font-size:14px;color:var(--ink-2)}
.hbe-freq{display:flex}

.hbe-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hbe-days button{aspect-ratio:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.hbe-days .sun{color:var(--sun)}.hbe-days .sat{color:var(--sat)}
.hbe-days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbe-danger{display:flex;flex-direction:column;gap:10px;margin-top:28px}

.ver-card div{display:flex;flex-direction:column}
.ver-card b{font-size:16px}
.ver-card span{font-size:13px;color:var(--ink-2)}

.ver-log summary{cursor:pointer;font-weight:600}
.ver-log ul{margin:8px 0 2px;padding-left:20px;color:var(--ink-2)}

.rf-dots i.t{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink-3)}

.rf-note{margin:10px 0 0;font-size:13px;color:var(--ink-2)}

.rf-mcal b{font-size:11px;font-weight:500;color:var(--ink-2)}.rf-mcal b.sun{color:var(--sun)}.rf-mcal b.sat{color:var(--sat)}

.rf-mcal i::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:var(--a)}
.rf-mcal i span{position:relative;font-size:11px;font-weight:700;color:var(--ink)}
.rf-mcal i.past{opacity:.38}
.rf-mcal i.e{background:transparent}.rf-mcal i.e::before{display:none}
.rf-mcal i.t{box-shadow:inset 0 0 0 2px var(--ink)}
.rf-wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.rf-wds .bar{position:relative;display:block;height:110px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.rf-wds .bar::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.rf-wds .bar i{position:absolute;z-index:1;left:18%;right:18%;border-radius:5px}
.rf-wds .bar i.pos{bottom:50%;background:linear-gradient(#E8703F,#F2C35A)}
.rf-wds .bar i.neg{top:50%;background:linear-gradient(#9EC3E0,#4E7FAF)}
.rf-wds .w{display:block;font-size:12px;margin-top:4px}.rf-wds .sun{color:var(--sun)}.rf-wds .sat{color:var(--sat)}
.rf-wds small{font-size:11px;color:var(--ink-2)}

/* swipe: month / week strips */
let sx = 0, sy = 0, zone = null;
main.addEventListener('touchstart', e => { const z = e.target.closest('[data-swipe]'); zone = z ? z.dataset.swipe : null; if (zone) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });

  if (!zone) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, z = zone; zone = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  const dir = dx < 0 ? 1 : -1;

  if (z === 'month') { const F = P(st.calMonth); F.setMonth(F.getMonth() + dir); st.calMonth = iso(F); const first = st.calMonth; st.sel = first.slice(0, 7) === todayISO().slice(0, 7) ? todayISO() : first; }
  else if (z === 'week') { st.day = addDays(st.day, dir * 7); }
  else if (z === 'jweek') { st.jWeek = Math.min(0, st.jWeek + dir); }
  render();

/* ================= 家計簿 (money) =================
   entries: { id, k:'out'|'in', amt (yen), cat, memo, date, ts, fx? (made by a fixed cost) }
   a "month" can start on any day (月の開始日): mnPeriod(ym) gives its first and last date */
const MN_COLORS = ['#8EC392','#B9B5AE','#F0B65A','#5AA8D8','#8E4FB5','#4A4658','#D45B57','#C9935F','#D9628E','#4E9F7A','#AFC28A','#5B7DBE','#E98C6E','#7F8FC9','#9CA3AF','#C7A0D6'];
const mnDefaults = () => {
  const mk = names => names.map((name, i) => ({ id: uid() + i, name, color: MN_COLORS[i % MN_COLORS.length] }));
  return { entries: [], cats: { out: mk(['食費','学食費','外食費','日用品','薬','衣服','趣味','交通費','交際費','教科書','部活費','髪','飲料代','友達との遊び代','その他']), in: mk(['給料','仕送り','お小遣い','臨時収入','その他']) },
    budget: { total: 0, cats: {}, groups: [] }, fixed: [], accts: [], hist: [], set: { start: 1, carry: false, pct: true, cal: true, ops: true } };
};
function normMoney(m) {
  const dd = mnDefaults(); m = asObj(m);
  const cats = asObj(m.cats), out = { entries: [], cats: { out: [], in: [] }, budget: { total: 0, cats: {}, groups: [] }, fixed: [], accts: [], hist: [], set: Object.assign(dd.set, asObj(m.set)) };
  for (const k of ['out', 'in']) {
    const a = asArr(cats[k]).filter(c => typeof c.name === 'string' && c.name.trim()).map(c => ({ id: okId(c.id), name: c.name.trim().slice(0, 30), color: okColor(c.color) ? c.color : MN_COLORS[0] }));
    out.cats[k] = a.length ? a : dd.cats[k];
  }
  out.entries = asArr(m.entries).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number.isFinite(+e.amt)).map(e => {
    const x = { id: okId(e.id), k: e.k === 'in' ? 'in' : 'out', amt: Math.round(Math.abs(+e.amt)), cat: okId(e.cat), memo: String(e.memo ?? '').slice(0, 80), date: e.date, ts: +e.ts || 0 };
    if (e.fx) x.fx = okId(e.fx); return x;
  });
  const b = asObj(m.budget); out.budget.total = Math.max(0, Math.round(+b.total || 0));
  // groups: one budget shared by several categories (食費＋学食費＋外食費 で月3万円 など)
  out.budget.groups = asArr(b.groups).map(g => ({ id: okId(g.id), name: String(g.name ?? '').trim().slice(0, 30) || 'グループ', amt: Math.max(0, Math.round(+g.amt || 0)), cats: (Array.isArray(g.cats) ? g.cats : []).filter(c => /^[\w-]{1,48}$/.test(String(c))).map(String) }));
  for (const [k, v] of Object.entries(asObj(b.cats))) if (+v > 0 && /^[\w-]{1,48}$/.test(k)) out.budget.cats[k] = Math.round(+v);
  out.fixed = asArr(m.fixed).filter(f => Number.isFinite(+f.amt)).map(f => ({ id: okId(f.id), k: f.k === 'in' ? 'in' : 'out', amt: Math.round(Math.abs(+f.amt)), cat: okId(f.cat), memo: String(f.memo ?? '').slice(0, 80),
    day: Math.min(31, Math.max(1, Math.round(+f.day) || 1)), from: /^\d{4}-\d{2}$/.test(f.from) ? f.from : todayISO().slice(0, 7), done: asObj(f.done) }));
  // 貯金額: balances typed in by hand per place (bank, PayPay, cash …), plus the total on each day it changed
  out.accts = asArr(m.accts).filter(a => typeof a.name === 'string' && a.name.trim()).map(a => ({ id: okId(a.id), name: a.name.trim().slice(0, 30), color: okColor(a.color) ? a.color : MN_COLORS[0], bal: Math.round(+a.bal) || 0, ts: +a.ts || 0 }));
  out.hist = asArr(m.hist).filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && Number.isFinite(+h.t)).map(h => ({ d: h.d, t: Math.round(+h.t) })).slice(-400);

const yen = n => '¥' + Math.round(n).toLocaleString();
const yenS = n => (n < 0 ? '−' : '') + yen(Math.abs(n));
const mnCats = k => S.money.cats[k];
const mnCat = (k, id) => S.money.cats[k].find(c => c.id === id) || S.money.cats[k === 'in' ? 'out' : 'in'].find(c => c.id === id) || { id, name: '（削除したカテゴリー）', color: '#9CA3AF' };
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number), d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
// the budget month "ym": starts on 月の開始日. A start after the 15th belongs to the month it mostly covers (25日 → 10月 = 9/25〜10/24)
function mnPeriod(ym) {
  const s = S.money.set.start; let [y, m] = ym.split('-').map(Number);
  if (s === 1) return [`${ym}-01`, iso(new Date(y, m, 0))];
  if (s > 15) { m -= 1; if (!m) { m = 12; y--; } }
  return [iso(new Date(y, m - 1, s)), iso(new Date(y, m, s - 1))];
}
function mnYmOf(d) {
  const s = S.money.set.start; if (s === 1) return d.slice(0, 7);
  const ym = d.slice(0, 7), day = +d.slice(8);
  if (s > 15) return day >= s ? ymAdd(ym, 1) : ym;
  return day < s ? ymAdd(ym, -1) : ym;
}
function mnSum(list) { let i = 0, o = 0; for (const e of list) { if (e.k === 'in') i += e.amt; else o += e.amt; } return { i, o, net: i - o }; }
function mnMonth(ym) { const [a, b] = mnPeriod(ym), list = S.money.entries.filter(e => e.date >= a && e.date <= b); return Object.assign(mnSum(list), { a, b, list }); }
const mnCarry = ym => mnSum(S.money.entries.filter(e => e.date < mnPeriod(ym)[0])).net;
function mnByDay(a, b) {
  const m = new Map();
  for (const e of S.money.entries) if (e.date >= a && e.date <= b) { const x = m.get(e.date) || { i: 0, o: 0 }; if (e.k === 'in') x.i += e.amt; else x.o += e.amt; m.set(e.date, x); }
  return m;
}
const mnSort = (a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0);
// 固定費・定期収入: add each month's entry once its day has come (deleting that entry does not bring it back)
function mnApplyFixed() {
  const T = todayISO(), cur = T.slice(0, 7); let added = 0;
  for (const f of S.money.fixed) {
    for (let ym = f.from, g = 0; ym <= cur && g < 240; ym = ymAdd(ym, 1), g++) {
      const [y, m] = ym.split('-').map(Number), d = `${ym}-${pad(Math.min(f.day, new Date(y, m, 0).getDate()))}`;
      if (f.done[ym] || d > T) continue;
      const e = { id: uid(), k: f.k, amt: f.amt, cat: f.cat, memo: f.memo, date: d, ts: Date.now(), fx: f.id };
      S.money.entries.push(e); f.done[ym] = e.id; added++;
    }

// 電卓: "500+320×2" → 1140 (× ÷ before + −), rounded to whole yen
function mnEval(s) {
  const tk = String(s).match(/\d+|[+\-×÷]/g) || []; let total = 0, term = null, sign = 1, op = null;
  for (const x of tk) {
    if (/\d/.test(x)) { const v = +x; term = term === null ? v : op === '×' ? term * v : op === '÷' ? (v ? term / v : term) : v; op = null; }
    else if (x === '×' || x === '÷') op = x;
    else { if (term !== null) total += sign * term; term = null; op = null; sign = x === '-' ? -1 : 1; }
  }
  if (term !== null) total += sign * term;
  return Math.round(total);
}

/* calendar pinch: 2 fingers apart/together switch the month between 3 sizes (dots → normal → tall cells), like iOS Calendar.
   Everything moves with transforms only (no relayout while the fingers move, so it stays at 60fps):
   - while pinching, the week rows spread apart / close up under the fingers, and the cards below ride along;
   - on release the new size is laid out once, the old picture cross-fades away, and every row and card

  ws.forEach((w, i) => { w.style.transition = 'none'; w.style.transform = p ? `translate3d(0,${(i * step * p).toFixed(1)}px,0)` : ''; });
  pzBelow(g).forEach(n => { n.style.transition = 'none'; n.style.transform = p ? `translate3d(0,${tail}px,0)` : ''; });

}

  g.style.setProperty('--pzf', '1');
  setTimeout(() => { if (g.isConnected) [...g.children, ...pzBelow(g)].forEach(n => { n.style.transition = ''; }); }, 460);
}
function calZoomTo(z) {
  const g0 = $('#monthGrid'); if (!g0) { S.settings.calZoom = z; save(); render(); return; }
  const rows0 = [...g0.children].map(w => w.getBoundingClientRect().top), below0 = pzBelow(g0)[0], b0 = below0 ? below0.getBoundingClientRect().top : 0;
  // a picture of the month as it is now, laid over the new one and faded out

  S.settings.calZoom = z; save(); render();

main.addEventListener('touchstart', e => {
  if (e.touches.length !== 2 || !e.target.closest('#monthGrid')) return;
  const [a, b] = e.touches; pz = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1, z: calZoomLv(), p: 0 }; zone = null;

/* ================= 灯 (habits): a Grit-style habit tracker inside ひび手帳 =================

    const kind = ['check', 'count', 'time'].includes(h.kind) ? h.kind : 'check', f = asObj(h.freq);
    const days = (Array.isArray(f.days) ? f.days : []).map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 6);
    const t = f.t === 'week' ? 'week' : f.t === 'days' && days.length ? 'days' : 'daily';
    return {
      id: okId(h.id), name: h.name.slice(0, 60), emoji: typeof h.emoji === 'string' ? h.emoji.slice(0, 16) : '', color: okColor(h.color) ? h.color : HB_COLORS[0], kind,
      goal: kind === 'check' ? 1 : Math.max(1, Math.min(kind === 'time' ? 86400 : 999, Math.round(+h.goal || (kind === 'time' ? 300 : 1)))),
      unit: typeof h.unit === 'string' ? h.unit.slice(0, 8) : '', freq: { t, days: [...new Set(days)], n: Math.max(1, Math.min(7, Math.round(+f.n || 3))) },

/* 積み重ね: a year of each habit as squares (GitHub-style) */
function hbHeatSVG(h, weeks) {

    const op = f >= 1 ? 1 : f > 0 ? .3 + f * .45 : pre ? .06 : .16;
    r += `<rect x="${(w * (cs + g)).toFixed(1)}" y="${(i * (cs + g)).toFixed(1)}" width="${cs}" height="${cs}" rx="2.4" fill="${h.color}" fill-opacity="${op}"${d === T ? ' class="t"' : ''}/>`;
  }
  return `<svg class="hb-heat" viewBox="0 0 ${(weeks * (cs + g) - g).toFixed(1)} ${(7 * (cs + g) - g).toFixed(1)}" aria-hidden="true">${r}</svg>`;
}
// 1か月: this month as a small calendar per habit, two cards across

/* 統計 */
function hbStatsHTML() {
  const T = todayISO(), act = hbAct(), all = !HBV.sh || !hbById(HBV.sh), hs = all ? act : [hbById(HBV.sh)];
  const from = addDays(T, -(HBV.sp - 1));
  let s = `<div class="hb-row"><div class="seg">${[[7, '7日'], [28, '28日'], [365, '1年']].map(([n, l]) => `<button data-act="hbSp" data-n="${n}" aria-pressed="${HBV.sp === n}">${l}</button>`).join('')}</div></div>
    <div class="hb-chips"><button class="hb-chip${all ? ' on' : ''}" data-act="hbSh" data-id=""><span>${ico('check')}</span>すべて</button>${act.map(h => `<button class="hb-chip${HBV.sh === h.id ? ' on' : ''}" style="--c:${h.color}" data-act="hbSh" data-id="${h.id}"><span>${esc(h.emoji || '•')}</span>${esc(h.name)}</button>`).join('')}</div>`;
  if (!act.length) return s + '<p class="empty">習慣を追加すると、ここに記録がまとまります。</p>';
  // completion rate in the period
  let tot = 0, done = 0; const hours = Array(24).fill(0), wdT = Array(7).fill(0), wdD = Array(7).fill(0);
  for (const h of hs) {
    if (h.freq.t === 'week') {
      for (let ws = weekStart(from); ws <= T; ws = addDays(ws, 7)) {
        let c = 0; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d >= from && d <= T && d >= h.c && hbDone(h, d)) c++; }
        if (addDays(ws, 6) < h.c) continue;
        let inDays = 0; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d >= from && d <= T && d >= h.c) inDays++; }
        const got = Math.min(c, h.freq.n); tot += Math.max(got, Math.round(h.freq.n * inDays / 7)); done += got;
      }
    }
    for (let d = from > h.c ? from : h.c, i = 0; d <= T && i < 400; d = addDays(d, 1), i++) {
      const e = hbE(d, h.id), ok = hbDone(h, d);
      if (ok && e && e.t) hours[new Date(e.t).getHours()]++;
      if (h.freq.t === 'week' || !hbSched(h, d) || hbSkip(h, d)) continue;
      tot++; wdT[wd(d)]++; if (ok) { done++; wdD[wd(d)]++; }
    }
  }
  const pct = tot ? Math.round(done / tot * 100) : 0;
  s += `<div class="hb-sec">完了率</div><div class="hb-card2"><div class="hb-big2"><span class="hb-ic g">${ico('wave')}</span><div><b class="num">${pct}%</b><small>${tot}回中${done}回</small></div></div>
    <div class="hb-bar2"><i style="width:${tot ? done / tot * 100 : 0}%"></i></div><div class="hb-leg"><span class="g">完了 ${done}回</span><span class="o">未完了 ${tot - done}回</span></div></div>`;
  // streaks
  let cur = 0, best = 0, who = '';
  if (all) { // days in a row with every habit of the day done
    let d = T, i = 0; const okDay = x => { const f = hbDayFrac(x); return f >= 1 ? 1 : f < 0 ? 0 : -1; };
    if (okDay(d) < 1) d = addDays(d, -1);
    for (; i < 3660; d = addDays(d, -1), i++) { const k = okDay(d); if (k === 1) cur++; else if (k === 0 && act.some(h => h.c <= d)) continue; else break; }
    for (const h of act) { const b = hbBest(h); if (b > best) { best = b; who = h.name; } }
  } else { cur = hbStreak(hs[0]); best = hbBest(hs[0]); }
  const u = !all && hs[0].freq.t === 'week' ? '週' : '日';
  s += `<div class="hb-sec">連続記録</div><div class="hb-card2"><div class="hb-big2"><span class="hb-ic f">${HB_FLAME}</span><div><b class="num">${cur}${u}</b><small>${all ? 'すべての習慣ができた日の連続' : cur ? 'この調子で続けましょう' : '今日から始めましょう'}</small></div></div>
    <div class="hb-kv"><span>最長</span><b class="num">${best}${u}</b>${all && who ? `<small>${esc(who)}</small>` : ''}</div>${!all ? `<div class="hb-kv"><span>合計</span><b class="num">${hbTotal(hs[0])}回</b></div>` : ''}</div>`;
  // time of day
  const B = [['朝', 5, 11, '#F0A04B'], ['午後', 11, 17, '#5AA8D8'], ['夕方', 17, 21, '#C056E0'], ['夜', 21, 29, '#6F7BE0']];
  const band = h => B.find(b => (h >= b[1] && h < b[2]) || (h + 24 >= b[1] && h + 24 < b[2]));
  const mx = Math.max(1, ...hours);
  s += `<div class="hb-sec">習慣を完了する時間帯</div><div class="hb-card2"><div class="hb-hours">${hours.map((n, i) => `<i style="height:${n ? Math.max(6, n / mx * 100) : 0}%;background:${band(i)[3]}" title="${i}時 ${n}回"></i>`).join('')}</div>
    <div class="hb-hx num"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span></span></div>
    <div class="hb-leg">${B.map(b => `<span style="--k:${b[3]}">${b[0]} ${hours.reduce((n, x, i) => n + (band(i) === b ? x : 0), 0)}</span>`).join('')}</div></div>`;
  // by weekday

  // badges
  const bds = hs.flatMap(h => hbBadges(h).filter(b => b.got).map(b => Object.assign({ h }, b)));
  s += `<div class="hb-sec">集めたバッジ <span class="num">${bds.length}個</span></div><div class="hb-card2">${bds.length ? `<div class="hb-badges">${bds.slice(-16).reverse().map(b => `<div class="hb-bd got" style="--c:${b.h.color}"><i>${b.ic}</i>${esc(b.lbl)}<small>${esc(b.h.emoji || '')} ${esc(b.h.name)}</small></div>`).join('')}</div>` : '<p class="empty" style="padding:6px">3日続けると、最初のバッジがもらえます</p>'}</div>`;
  // the last 7 days, habit by habit
  if (all) {

    s += `<div class="hb-sec">この7日間</div><div class="hb-card2 hb-tbl"><div class="hb-tr hd"><span></span>${days.map(d => `<span class="${wd(d) === 0 ? 'sun' : wd(d) === 6 ? 'sat' : ''}">${WD[wd(d)]}</span>`).join('')}</div>
      ${act.map(h => `<div class="hb-tr" style="--c:${h.color}"><b>${esc(h.emoji || '')} ${esc(h.name)}</b>${days.map(d => { const f = d < h.c ? -1 : hbClamp(hbVal(h, d) / h.goal); return `<i class="${f >= 1 ? 'on' : f > 0 ? 'part' : f < 0 ? 'pre' : hbSkip(h, d) ? 'sk' : h.freq.t === 'days' && !hbSched(h, d) ? 'rest' : ''}"></i>`; }).join('')}</div>`).join('')}</div>`;
  }
  return s + '<div class="hb-pad"></div>';
}

const HIBI_CHANGES = ['灯の習慣に「ひとことメモ」（Part5を20問など）。習慣の画面と積み重ねで見返せます', 'ポモドーロ（25分集中→5分休憩をくり返す）を集中タイマーと灯のタイマーに追加', '灯のタイマーで目標までやりきると、タイムラインにその時間の予定として記録', 'タイムラインの集中タイマーで計った時間も、同じ名前の灯の習慣に入るように', '今日の画面とタイムラインに、今日の習慣を表示（そこからチェックできます）', '灯にバッジ（連続日数・合計回数）と、達成したときのお祝い', '灯：習慣カードを長押ししてドラッグで並べ替え', 'ふりかえり：「今月の予定」（終わった予定の割合と、予定の多い日のカレンダー）。小さな集計はなくしました', 'ふりかえりに、灯の統計のような「日記の連続記録」「予定の完了率」「日記を書く時間帯」「曜日ごとの気分」を追加', 'カレンダーの上の大きな月の数字やアイコンの上半分がぼやけて見えるのを修正', '日記の右上のアイコンを、ほかのタブと同じ幅・位置に', '集中タイマーで横向き→縦向きに戻したとき、画面が上にずれるのを修正', '灯の「積み重ね」に「1か月」を追加（1か月・3か月・半年・1年の順）', '灯の統計で、今日まだできていない習慣も数えるように（達成率が100%になる不具合）'];
let verChecked = Date.now();
async function checkVersion(manual) {
  if (inFrame || location.protocol !== 'https:' || (!manual && Date.now() - verChecked < 60000)) return; verChecked = Date.now();
  try {
    const t = await (await fetch('sw.js?v=' + Date.now(), { cache: 'no-store' })).text(), v = (t.match(/CACHE = '([^']+)'/) || [])[1];
    if (manual && !v) { toast('確認できませんでした。通信を確かめてください'); return; }
    if (!v || v === APP_VER) { if (manual) toast(`最新のバージョンです（${HIBI_VERSION}）`); return; }
    if (manual) { toast('新しいバージョンがあります', '更新', () => location.reload()); return; }
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) reg.update().catch(() => {});
    const busy = stack.length || CAM || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (!busy) { location.reload(); return; }
    toast('新しいバージョンがあります', '更新', () => location.reload());
  } catch (e) { if (manual) toast('確認できませんでした。通信を確かめてください'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
setInterval(() => { if (document.visibilityState === 'visible') checkVersion(); }, 30 * 60000);
})();
