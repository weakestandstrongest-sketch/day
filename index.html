.pk-row.on .pk-chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}.pk-row.on .pk-chk .ico{opacity:1}
.pk-rm{color:var(--ink-3);width:28px;height:28px;display:grid;place-items:center}.pk-rm .ico{width:15px;height:15px}
.pk-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pk-sug button{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pk-badge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:11.5px;color:var(--ink-2)}
.pk-badge .ico{width:13px;height:13px}
.pk-badge.ok{color:#2FA36B}
.pk-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin:0 0 12px}
.pk-card h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:15px}
.pk-card h3 .ico{width:18px;height:18px;color:var(--accent)}
.pk-card h3 .sub{margin-left:auto;font-size:12px;color:var(--ink-2);font-weight:500}
.pk-ev+.pk-ev{margin-top:10px}
.pk-ev b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.pk-ev b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pk-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 8px;border-radius:99px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.pk-chip .ico{width:15px;height:15px;stroke-width:3;color:var(--ink-3)}
.pk-chip.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:transparent;color:var(--ink-2);text-decoration:line-through}
.pk-chip.on .ico{color:var(--c)}
/* app lock */
.lock{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 70%);display:flex;align-items:center;justify-content:center;color:var(--ink);user-select:none;-webkit-user-select:none}
.lk-in{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lk-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.lk-ic .ico{width:28px;height:28px}
.lk-t{font-size:19px;margin-top:14px}
.lk-s{font-size:13px;color:var(--ink-2);margin-top:4px;min-height:18px;text-align:center}
.lk-dots{display:flex;gap:16px;margin:22px 0 26px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.lk-dots i.on{background:var(--ink);border-color:var(--ink)}
.lk-dots.err{animation:lkShake .4s}
@keyframes lkShake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px}
.lk-pad button{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:500;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center}
.lk-pad button:active{background:var(--surface-2)}
.lk-pad .ghost{background:transparent;box-shadow:none;font-size:14px;font-weight:700}
.lk-pad .ghost .ico{width:30px;height:30px}
.lk-foot{margin-top:22px;font-size:13.5px;color:var(--accent);font-weight:700}
.lk-warn{text-align:center;font-size:14px;line-height:1.7;margin:18px 0 14px}
.lk-in>.btn{width:100%;margin-bottom:8px}
/* to-do */
.todo{margin:26px 0 8px;scroll-margin-top:70px}
.td-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.td-head h2{margin:0;font-size:22px;display:flex;align-items:baseline;gap:10px}
.td-head .script{font-size:26px}
.td-add{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:700;align-self:center}
.td-add .ico{width:16px;height:16px}
.td-g{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:2px 14px;margin-bottom:10px}
.td-gl{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--ink-2)}
.td-gl span{font-weight:500;color:var(--ink-3)}
.td-g.g-over .td-gl{color:var(--sun)}.td-g.g-today .td-gl{color:var(--accent)}
.td-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.td-row+.td-row{border-top:1px solid var(--line)}
.td-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff}
.td-chk .ico{width:15px;height:15px;stroke-width:3;opacity:0}
.td-row.done .td-chk{background:var(--c)}.td-row.done .td-chk .ico{opacity:1}
.td-row.done b{color:var(--ink-3);text-decoration:line-through}
.td-main{text-align:left;min-width:0}
.td-main b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-main small{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--ink-2);margin-top:2px}
.td-main small>span:not(.td-cls){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.td-cls{display:inline-flex;align-items:center;gap:4px;color:var(--c);font-weight:700}
.td-cls::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.td-prog{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden;max-width:220px}
.td-prog b{display:block;height:100%;border-radius:2px;background:var(--c)}
.td-wait{color:var(--sat);font-weight:700}
.td-due{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.td-due.soon{background:color-mix(in srgb,#EDA04B 18%,var(--surface));color:#C9781F}
.td-due.over{background:color-mix(in srgb,var(--sun) 15%,var(--surface));color:var(--sun)}
.td-done-t{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);padding:6px 4px;margin-bottom:6px}
.td-done-t .ico{width:16px;height:16px}
.td-clear{display:block;margin:6px auto 10px;font-size:12.5px;color:var(--ink-2);text-decoration:underline}
.td-jump{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 0;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;text-align:left}
.td-jump .ico{width:18px;height:18px;color:var(--accent);flex:none}
.td-jump b{flex:1}
.td-jump em{font-style:normal;font-size:12px;font-weight:700;color:var(--sun)}
/* transit (のりかえ) */
.sheet.nk{display:flex;flex-direction:column;padding-bottom:0}
.sheet.nk .sh-bar{flex:none}
.nk-wrap{position:relative;flex:1;display:flex;margin:0 -16px;min-height:0}
.nk-frame{flex:1;width:100%;border:0;background:var(--bg);min-height:0;opacity:0;pointer-events:none;transition:opacity .25s}
.nk-wrap.ready .nk-frame{opacity:1;pointer-events:auto}
.nk-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);color:var(--ink-2);font-size:14px;padding:0 32px;text-align:center;transition:opacity .25s}
.nk-load>b{font-weight:500}
.nk-wrap.ready .nk-load{opacity:0;pointer-events:none}
.nk-spin{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#4F8ED6 16%,var(--surface));color:#4F8ED6;animation:nkBob 1.1s ease-in-out infinite}
.nk-spin .ico{width:26px;height:26px}
@keyframes nkBob{50%{transform:translateY(-6px)}}
.nk-fail{display:none;flex-direction:column;align-items:center;gap:8px}
.nk-fail b{color:var(--ink);font-size:15px}
.nk-fail small{font-size:12.5px;line-height:1.6}
.nk-fail .btn{margin-top:6px;min-width:180px}
.nk-wrap.fail .nk-fail{display:flex}
.nk-wrap.fail .nk-load>b,.nk-wrap.fail .nk-spin{display:none}
.orb-ico{width:22px;height:22px;border-radius:50%;display:block;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 30%),radial-gradient(circle at 30% 68%,#4F7CFF,rgba(79,124,255,0) 72%),radial-gradient(circle at 74% 80%,#2EC5F0,rgba(46,197,240,0) 62%),#1D2447;box-shadow:0 2px 7px rgba(79,124,255,.4),inset 0 -2px 4px rgba(0,0,0,.35)}
.ob-big{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 30%),radial-gradient(circle at 30% 68%,#4F7CFF,rgba(79,124,255,0) 72%),radial-gradient(circle at 74% 80%,#2EC5F0,rgba(46,197,240,0) 62%),#1D2447;box-shadow:0 10px 30px rgba(79,124,255,.45),inset 0 -4px 8px rgba(0,0,0,.35);animation:obPulse 1.6s ease-in-out infinite}
@keyframes obPulse{50%{transform:scale(1.08);box-shadow:0 14px 40px rgba(46,197,240,.55),inset 0 -4px 8px rgba(0,0,0,.35)}}
.nk-wrap.fail .ob-big{display:none}
.bb-ico{width:26px;height:26px;display:block;color:var(--ink)}
.bb-ico .dl{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.bb-ico .b1,.bb-ico .b2,.bb-ico .b3{fill:var(--bg);stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.bb-ico .b1,.bb-ico .b2{fill:#F2A93B;stroke:#F2A93B}
.bb-ico .hp{fill:currentColor}
.bb-big{width:64px;height:64px;display:block;color:var(--ink-2)}
.bb-big .bb-ico{width:100%;height:100%;color:var(--ink-2)}
.bb-big .bb-ico .b1,.bb-big .bb-ico .b2,.bb-big .bb-ico .b3{fill:var(--bg);stroke:currentColor;animation:bbRun 1.5s infinite}
.bb-big .bb-ico .b2{animation-delay:.5s}.bb-big .bb-ico .b3{animation-delay:1s}
@keyframes bbRun{0%,30%{fill:#F2A93B;stroke:#F2A93B}40%,100%{fill:var(--bg);stroke:currentColor}}
.nk-wrap.fail .bb-big{display:none}
.nk-empty{padding:24px 6px;text-align:center;font-size:14px;line-height:1.8;color:var(--ink-2)}
.rt-sum{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.rt-sum .od{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex-wrap:wrap}
.rt-sum .od .ico{width:18px;height:18px;color:var(--ink-3)}
.rt-sum .tm{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.rt-sum .mt{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.rt-tags{display:flex;gap:6px;margin-top:8px}
.rt-tags span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:var(--c)}
.rt-steps{list-style:none;margin:0;padding:6px 16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.rt-steps li{display:grid;grid-template-columns:48px 18px minmax(0,1fr);gap:10px;align-items:stretch}
.rt-steps .t{font-size:12.5px;text-align:right;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.rt-steps .t b{font-size:14.5px;color:var(--ink)}
.rt-steps .mk{position:relative;display:flex;justify-content:center}
.rt-steps .st .mk::after{content:"";align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);z-index:1}
.rt-steps .st.first .mk::after,.rt-steps .st.last .mk::after{border-color:var(--accent);background:var(--accent)}
.rt-steps .st .nm{font-size:16px;font-weight:700;padding:12px 0;align-self:center}
.rt-steps .ac .mk::before{content:"";width:6px;border-radius:3px;background:var(--c,var(--accent))}
.rt-steps .ac.walk .mk::before{width:0;border-left:4px dotted var(--ink-3);background:none}
.rt-steps .ac .bd{padding:6px 0 10px;font-size:13px;color:var(--ink-2)}
.rt-steps .ac .ln{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.rt-steps .ac .ln::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.rt-steps .ac.walk .ln::before{display:none}
.rt-steps details{margin-top:4px}
.rt-steps summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px}
.rt-steps details li{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
.rt-acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tl-route{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--accent)}
.tl-route .ico{width:13px;height:13px}
/* leave-time hint */
.tl-leave{display:flex;align-items:center;gap:8px;width:calc(100% - 64px);margin:2px 0 6px 64px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,#4F8ED6 12%,var(--surface));color:var(--ink);font-size:12.5px;text-align:left}
.tl-leave .ico{width:17px;height:17px;color:#4F8ED6;flex:none}
.tl-leave b{font-size:14px}
.tl-leave small{color:var(--ink-2)}
.tl-leave.past{opacity:.55}
.tl-leave.err{background:var(--surface-2);color:var(--ink-2)}
.ev-leave{margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#4F8ED6 12%,var(--surface));font-size:13px;line-height:1.6}
.ev-leave b{font-size:15px}
.td-plan{display:inline-flex;align-items:center;gap:3px;color:#4F8ED6;font-weight:700}
.td-plan .ico{width:12px;height:12px}
.td-hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:0 0 10px}
/* today */
.td-hello{margin:6px 2px 14px}
.td-hello .script{font-size:30px}
.td-hello h2{margin:2px 0 0;font-size:26px}
.td-hello small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.tw{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;color:#fff;background:linear-gradient(150deg,var(--wa),var(--wb));margin-bottom:12px;width:100%;text-align:left}
.tw>.ico{width:42px;height:42px;stroke-width:1.5;flex:none}
.tw b{font-size:34px;font-weight:300;line-height:1}
.tw span{font-size:13px;line-height:1.5}
.tw span small{display:block;opacity:.85}
.tnext{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;border-left:6px solid var(--c)}
.tnext small{font-size:12px;color:var(--ink-2);font-weight:700}
.tnext b{display:block;font-size:19px;margin:2px 0}
.tnext .in{font-size:13px;color:var(--accent);font-weight:700}
.tlist{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:4px 16px;margin-bottom:12px}
.tlist h3{font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.trow{display:grid;grid-template-columns:52px 10px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;font-size:14.5px;width:100%;text-align:left}
.trow+.trow{border-top:1px solid var(--line)}
.trow .t{font-size:13px;color:var(--ink-2);text-align:right}
.trow i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.trow.done span:last-child{color:var(--ink-3);text-decoration:line-through}
.trow.now span:last-child{font-weight:700}
.qi{text-align:center;padding:6px 6px 4px}
.qi .script{font-size:28px}
.qi h2{font-size:26px;margin:6px 0 2px}
.qi .yomi{font-size:13px;color:var(--ink-2)}
.qi .src{display:inline-block;margin-top:8px;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.qi-box{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px;text-align:left;font-size:15px;line-height:1.8}
.qi-box b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.pring{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:6px auto 4px}
.pring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.pring circle{fill:none;stroke-linecap:round}
.pring .trk{stroke:color-mix(in srgb,var(--ink) 7%,transparent);stroke-width:11}
.pring .prj{stroke:var(--pay);stroke-opacity:.26;stroke-width:11}
.pring .dn{stroke:var(--pay);stroke-width:11}
.pring .prj,.pring .dn{stroke-dasharray:100 100;stroke-dashoffset:var(--o);animation:pringIn 1s cubic-bezier(.3,.7,.2,1) both}
.pring .dn{animation-delay:.15s}
@keyframes pringIn{from{stroke-dashoffset:100}}
.pring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.pring .lg{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.pring .lg i{width:9px;height:9px;border-radius:50%;background:var(--pay)}
.pring .lg i.p{background:color-mix(in srgb,var(--pay) 30%,transparent)}
.pring .big{font-size:clamp(28px,9vw,36px);font-weight:700;line-height:1.15;letter-spacing:.01em}
.pring .dnv{font-size:15px;font-weight:700;color:var(--pay)}
.pring .msg{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.pgoal{display:flex;align-items:center;gap:6px;margin:0 auto;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pgoal b{color:var(--pay);font-size:15px}
.pgoal .ico{width:15px;height:15px;color:var(--pay)}
.ptop{display:flex;flex-direction:column;align-items:center;gap:6px}
.pback{font-size:12.5px;color:var(--pay);font-weight:700;padding:2px 8px}
.pstats{display:flex;justify-content:center;gap:22px;margin:8px 0 2px;align-items:baseline}
.pstats span{font-size:12px;color:var(--ink-2)}
.pstats b{font-size:20px;margin-left:5px;color:var(--ink)}
.ptab{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.ptab th{font-weight:500;color:var(--ink-2);font-size:11.5px;text-align:right;padding:4px 0 8px}
.ptab td{padding:9px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ptab td:first-child,.ptab th:first-child{text-align:left;white-space:normal;font-weight:700}
.ptab td.g{color:var(--pay);font-weight:700}
.ptab tr.sum td{font-weight:700}
.pay-card .mring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.pay-card .mring circle{fill:none;stroke-width:6;stroke-linecap:round}
.pay-card .mring .trk{stroke:color-mix(in srgb,var(--ink) 7%,transparent)}
.pay-card .mring .prj{stroke:var(--pay);stroke-opacity:.24}
.pay-card .mring .dn{stroke:var(--pay)}
.pay-card .pay-meta .g{color:var(--pay);font-weight:700}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter.over i{background:var(--sun)}
button.set-row{width:100%;text-align:left}
button.set-row .ico{width:18px;height:18px;color:var(--ink-3)}
/* school */
.tt{display:grid;gap:4px}
.tt-h{font-size:12px;color:var(--ink-2);text-align:center;padding:2px 0}
.tt-h.now{color:var(--accent);font-weight:700}
.tt-p{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1.15}
.tt-p small{font-size:8.5px;color:var(--ink-3);font-weight:400}
.tt-cell{min-height:60px;border-radius:10px;padding:5px 4px;font-size:11px;font-weight:700;line-height:1.25;text-align:left;background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c);overflow:hidden;overflow-wrap:anywhere;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.tt-cell small{font-size:9.5px;font-weight:400;color:var(--ink-2);margin-top:2px}
.tt-cell.empty{background:var(--surface);border:1px dashed var(--line);color:var(--ink-3);align-items:center;justify-content:center;font-size:16px;font-weight:400}
.att{width:40px;height:30px;border-radius:9px;font-size:11.5px;font-weight:700;justify-self:center;border:1.5px solid var(--line);color:var(--ink-3)}
.att.present{background:#4E9F72;border-color:#4E9F72;color:#fff}
.att.late{background:#DE8E2A;border-color:#DE8E2A;color:#fff}
.att.absent{background:#C9574F;border-color:#C9574F;color:#fff}
.att.cancel{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
.tl-item.cancel .tt{text-decoration:line-through;color:var(--ink-3)}
.tl-item.cancel .pill{background:var(--surface);color:var(--c);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent);opacity:.8}
.tl-item.cancel .pill::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:currentColor;transform:rotate(-35deg);border-radius:1px}
.att-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.att-row:first-child{border-top:0}
.att-row b{display:flex;align-items:center;gap:6px;font-size:14px}
.att-row b i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.att-row small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.left{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);white-space:nowrap}
.left.warn{background:color-mix(in srgb,var(--sun) 18%,var(--surface));color:var(--sun)}
.due{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);white-space:nowrap}
.due.soon{background:color-mix(in srgb,var(--hol) 24%,var(--surface))}
.due.over{background:color-mix(in srgb,var(--sun) 20%,var(--surface));color:var(--sun)}
.hw{display:grid;grid-template-columns:30px minmax(0,1fr) auto 32px;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 6px 8px 12px}
.hw .chk{--c:var(--accent);width:26px;height:26px}
.hw .tt2{font-size:15px;overflow-wrap:anywhere;min-width:0}
.hw .tt2 small{display:block;font-size:11.5px;color:var(--ink-2)}
.hw.done .tt2{color:var(--ink-3);text-decoration:line-through}
.hw .del{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3)}
.hw .del .ico{width:16px;height:16px}
.hw-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.hw-form>:first-child,.hw-form>button{grid-column:1/-1}
.slot-list{display:flex;flex-wrap:wrap;gap:6px}
.slot-list span small{font-size:10.5px;color:var(--ink-2);margin-left:2px}
.term-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 12px;padding-bottom:2px}
.term-row::-webkit-scrollbar{display:none}
.term-row .chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.term-row .chip i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.term-row .chip.add{color:var(--ink-2);border-style:dashed}
.term-row .chip .ico{width:14px;height:14px}
.term-info{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--ink-2);margin:12px 2px 0;line-height:1.6}
.term-info b{color:var(--ink)}
.term-info button{color:var(--accent);font-weight:700;flex:none;padding:2px 0}
.term-card{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tc-h{display:flex;align-items:center;gap:8px}
.tc-h b{font-size:15.5px}
.tc-h small{margin-left:auto;font-size:12px;color:var(--ink-2)}
.tc-now{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:1px 8px}
.tc-r{font-size:13px;color:var(--ink-2)}
.tc-b{display:flex;flex-wrap:wrap;gap:6px}
.tc-b i{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:99px;padding:3px 10px 3px 7px;background:color-mix(in srgb,#E9A23B 16%,var(--surface-2));color:var(--ink)}
.tc-b .ico{width:13px;height:13px;color:#E9A23B}
.sd-add,.br-add,.co-mv{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.br-add .chips .chip{padding:5px 12px;font-size:12.5px}
.set-row .ico{width:15px;height:15px;display:inline;vertical-align:-2px;color:#E9A23B}
.co-head{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px;border-left:4px solid var(--c)}
.co-head .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);flex:none}
.co-head b{display:block;font-size:17px}
.co-head small{display:block;font-size:12.5px;color:var(--ink-2)}
.co-st{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding:8px 12px}
.co-st.off{color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line)}
.cl-tag{font-weight:700;color:var(--accent)}
.tl-item.cancel .cl-tag{color:var(--ink-2)}
.tl-item.extra .pill{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent)}
.slot-list span{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 6px 5px 12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.slot-list button{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3)}
.slot-list .ico{width:14px;height:14px}
.slot-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:8px}
.slot-add .inp{min-height:40px;padding:8px 10px}
.slot-add button{padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.per-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.per-row b{text-align:center;font-size:13px}
.per-row .inp{min-height:40px;padding:6px 10px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist div:first-child{border-top:0}
.hist .att{width:auto;height:auto;padding:3px 10px}
.tl-title{text-align:left}
/* year in pixels */
.pixels{display:grid;grid-template-columns:18px repeat(12,minmax(0,1fr));gap:2px}
.px{height:10px;border-radius:2px;background:var(--surface-2)}
.px.on{cursor:pointer}
.px.x{background:transparent}
.px.fut{opacity:.45}
.px-h,.px-d{font-size:9px;color:var(--ink-3);text-align:center;line-height:10px}
.px-h{line-height:14px}
/* focus timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 20px}
.tm-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-align:center;max-width:100%}
.tm-title i{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tm-title .ico{width:18px;height:18px}
.ring{position:relative;width:240px;height:240px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--c);transition:stroke-dashoffset 1s linear}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-size:46px;font-weight:700;line-height:1}
.ring .ctr small{font-size:12.5px;color:var(--ink-2);margin-top:10px;padding:0 24px}
.ring .ctr small.over{color:var(--sun);font-weight:700}
.timer .row2{width:100%}
.timer-start{width:100%;margin-bottom:14px}
#timerChip{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px)}
#timerChip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;animation:pulse 1.6s ease-in-out infinite}
#timerChip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.35}}
.tl-item.running .pill{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
/* Structured-style task editor */
.sheet.tk{padding-top:0;padding-bottom:0}
.tk-head{position:relative;margin:0 -16px;padding:16px 20px 26px;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),var(--c);color:#fff;touch-action:none}
.tk-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);margin:-6px auto 10px}
.tk-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff}
.tk-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:20px}
.tk-icon{position:relative;display:block}
.tk-icon .sq{width:78px;height:78px;border-radius:20px;background:#3A3A3C;border:3px solid #fff;display:grid;place-items:center;color:var(--c)}
.tk-icon .sq .ico{width:34px;height:34px;stroke-width:2.1}
.tk-icon .pal{position:absolute;left:-10px;bottom:-10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);color:#fff}
.tk-icon .pal .ico{width:20px;height:20px}
.tk-tt{min-width:0}
.tk-tt small{display:flex;align-items:center;gap:5px;font-size:12.5px;opacity:.9;margin-bottom:2px}
.tk-tt small .ico{width:15px;height:15px}
.tk-tt input{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.55);color:#fff;font-size:22px;font-weight:700;padding:4px 0 6px;border-radius:0}
.tk-tt input:focus,.tk-tt input:focus-visible{outline:none;border-bottom-color:#fff}
.tk-tt input::placeholder{color:rgba(255,255,255,.65)}
.tk-done{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;color:var(--c)}
.tk-done .ico{width:18px;height:18px;stroke-width:3;opacity:0}
.tk-done.on{background:#fff}
.tk-done.on .ico{opacity:1}
.tk-sec{font-size:15px;font-weight:700;color:var(--ink-2);margin:20px 6px 10px}
.sugg{background:var(--surface);border-radius:22px;padding:2px 0;box-shadow:var(--shadow)}
.sugg button{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;width:100%;text-align:left}
.sugg .ic{display:grid;place-items:center;color:var(--c)}
.sugg .ic .ico{width:26px;height:26px;stroke-width:2}
.sugg .tx{padding:12px 16px 12px 0;border-top:1px solid var(--line)}
.sugg button:first-child .tx{border-top:0}
.sugg small{display:block;font-size:12.5px;color:var(--ink-2)}
.sugg b{font-size:16.5px}
.tk-body{display:flex;flex-direction:column;gap:12px;padding-top:20px}
.tk-row{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border-radius:999px;padding:15px 20px;font-size:17px;text-align:left}
.tk-row span{flex:1}
.tk-row>.ico:first-child{color:var(--c);width:24px;height:24px}
.tk-row>.ico:last-child{color:var(--ink-3);width:18px;height:18px}
.tk-durs{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.tk-durs .chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tk-chips{display:flex;gap:8px;flex-wrap:wrap}
.tk-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:12px 18px;font-size:15.5px}
.tk-chip .ico{width:20px;height:20px}
.tk-chip.on{background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.tk-chip.ghost{background:transparent;color:var(--ink-2);padding:12px 8px}
.tk-card{background:var(--surface);border-radius:22px;padding:4px 16px 10px}
.stk{display:grid;grid-template-columns:26px minmax(0,1fr) 28px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.stk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;color:#fff}
.stk .box .ico{width:14px;height:14px;stroke-width:3;opacity:0}
.stk.on .box{background:var(--c);border-color:var(--c)}
.stk.on .box .ico{opacity:1}
.stk.on>span{color:var(--ink-3);text-decoration:line-through}
.stk .rm{color:var(--ink-3);display:grid;place-items:center;width:28px;height:28px}
.stk .rm .ico{width:16px;height:16px}
.stk.add{grid-template-columns:26px minmax(0,1fr)}
.stk input{border:0;background:transparent;font-size:16px;padding:2px 0;color:var(--ink);min-width:0}
.stk input:focus,.stk input:focus-visible{outline:none}
.tk-card textarea{display:block;width:100%;border:0;background:transparent;resize:none;min-height:120px;padding:12px 0 0;font-size:16px;line-height:1.6;color:var(--ink)}
.tk-card textarea:focus,.tk-card textarea:focus-visible{outline:none}
.tk-del{color:var(--sun);font-size:14px;font-weight:700;padding:8px;align-self:center}
.tk-foot{position:sticky;bottom:0;padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:14px;background:linear-gradient(transparent,var(--bg) 30%)}
.tk-go{width:100%;min-height:58px;border-radius:999px;background:var(--c);color:#fff;font-size:17px;font-weight:700;box-shadow:none}
.tk-go:disabled{opacity:.45}
/* event editor (Structured style) */
.tk-more{position:absolute;right:20px;top:25px}
.tk-more .ico{width:24px;height:24px;stroke-width:2.6}
.tk-icon .sq.cap{width:74px;height:124px;border-radius:37px}
.tk-rep{display:inline-flex;margin-top:8px;opacity:.85}
.tk-rep .ico{width:18px;height:18px}
.ev-list{background:var(--surface);border-radius:22px;overflow:hidden}
.ev-li{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 18px;text-align:left;font-size:16.5px}
.ev-list>*+.ev-li::before{content:"";position:absolute;left:56px;right:0;top:0;border-top:1px solid var(--line)}
.ev-li>.ico:first-child{width:24px;height:24px;color:var(--c);flex:none}
.ev-li>span{flex:1;min-width:0}
.ev-show>span{display:flex;flex-direction:column;gap:8px}
.ev-show .seg{display:flex;align-self:stretch}
.ev-show .seg button{flex:1;font-size:13px;padding:6px 4px}
.ev-li>span small{display:block;font-size:12px;color:var(--ink-2)}
.ev-li em{font-style:normal;color:var(--ink-2);font-size:14.5px;white-space:nowrap}
.ev-li>.ico:last-child{width:18px;height:18px;color:var(--ink-3);flex:none}
.ev-x{padding:2px 18px 14px 56px;min-width:0}
.dt-grid{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.dt-grid.t{grid-template-columns:32px minmax(0,1.3fr) minmax(0,1fr)}
.dt-l{font-size:12.5px;color:var(--ink-2)}
.dt-grid .inp{min-height:44px;padding:9px 10px;font-size:16px}
@media (max-width:389px){.ev-x{padding-left:20px}}
.ev-x .fld{margin-bottom:10px}
.sw-in{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.sw-in::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-in:checked{background:var(--c)}
.sw-in:checked::after{transform:translateX(20px)}
.ev-x .toggle{background:transparent;border:0;padding:4px 0;min-height:40px}
.ev-del{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:999px;background:var(--surface);color:var(--sun);font-weight:700;font-size:16px}
.ev-del .ico{width:20px;height:20px}
.choice .btn .ico{width:20px;height:20px}
/* focus timer — full screen, standby-clock style */
.sheet.fs{max-width:none;max-height:none;height:100%;border-radius:0;padding:0;background:#0b0b10;overflow:hidden}
.tm-fs{position:relative;height:100%;display:flex;flex-direction:column;color:#fff;overflow:hidden;background:var(--tbg,#0b0b10);--dfont:var(--f-body);--dw:700}
.tm-art{position:absolute;inset:-25%;filter:blur(46px) saturate(150%);pointer-events:none}
.tm-art i{position:absolute;width:62%;height:62%;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.tm-art i:nth-child(1){background:var(--t1);left:2%;top:4%}
.tm-art i:nth-child(2){background:var(--t2);right:0;top:32%;animation-duration:23s;animation-delay:-6s}
.tm-art i:nth-child(3){background:var(--t3);left:18%;bottom:0;animation-duration:27s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,-10%) scale(1.18)}100%{transform:translate(-10%,12%) scale(.92)}}
.face-ring .tm-art,.face-cards .tm-art{opacity:.75}
.tm-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;touch-action:none}
.tm-top span{font-size:14px;font-weight:600;opacity:.9}
.tm-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tm-btn .ico{width:22px;height:22px}
.tm-center{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 20px;text-align:center;min-height:0}
.tm-name{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;max-width:100%}
.tm-name i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}
.tm-name .ico{width:18px;height:18px}
.tm-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-big{font-size:clamp(72px,min(25vw,34vh),240px);font-weight:700;line-height:.95;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.18)}
.tm-cards{display:flex;gap:12px}
.tm-cards b{display:grid;place-items:center;min-width:min(38vw,32vh);padding:4px 12px;font-size:clamp(64px,min(21vw,28vh),200px);font-weight:700;line-height:1.1;border-radius:30px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tm-cards.over b{color:#ffd8cf}
.face-ring .ring{width:min(72vw,46vh);height:min(72vw,46vh)}
.face-ring .ring .bgc{stroke:rgba(255,255,255,.22)}
.face-ring .ring .fgc{stroke:#fff}
.face-ring .ring .ctr b{font-size:clamp(44px,min(15vw,10vh),90px);color:#fff}
#tm-sub{font-size:13.5px;opacity:.92}
#tm-sub.over{color:#ffd8cf;font-weight:700;opacity:1}
.tm-bar{width:min(320px,72%);height:6px;border-radius:3px;background:rgba(255,255,255,.24);overflow:hidden}
.tm-bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width 1s linear}

<script>
(() => {
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const P = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = P(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((P(b) - P(a)) / 864e5);
const todayISO = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const wd = s => P(s).getDay();
const mondayOf = s => addDays(s, -((wd(s) + 6) % 7));
const sunStart = () => S.settings.weekStart === 'sun';
const weekStart = s => sunStart() ? addDays(s, -wd(s)) : mondayOf(s);
const weekOrder = () => sunStart() ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 0];
const dowHead = cls => weekOrder().map(w => `<span class="${cls}${w === 6 ? ' sat' : w === 0 ? ' sun' : ''}">${WD[w]}</span>`).join('');
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const evLen = ev => { const x = toMin(ev.end) - toMin(ev.start); return x > 0 ? x : x + 1440; };
const overnight = ev => !ev.allDay && !multiDay(ev) && toMin(ev.end) <= toMin(ev.start);
// days an event covers after its first: 終日 spans and timed events running over several days (those stay on the calendar only)
const evSpan = ev => ev.endDate && ev.endDate > ev.date && (ev.allDay || ev.calOnly) ? diffDays(ev.date, ev.endDate) : 0;
const multiDay = ev => !ev.allDay && !!ev.endDate && ev.endDate > ev.date;
const endLabel = ev => (overnight(ev) ? '翌' : '') + hm(ev.end);

const hm = t => t.replace(/^0(\d)/, '$1');

const md = s => { const d = P(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

const BLOB = ['58% 42% 55% 45% / 52% 58% 42% 48%', '45% 55% 40% 60% / 55% 45% 60% 40%', '62% 38% 50% 50% / 45% 55% 45% 55%', '50% 50% 62% 38% / 60% 40% 55% 45%', '40% 60% 55% 45% / 50% 50% 60% 40%'];

  const nthMon = (m, n) => { const f = new Date(y, m - 1, 1); return iso(new Date(y, m - 1, 1 + (8 - f.getDay()) % 7 + 7 * (n - 1))); };

  for (let d = gs; d <= ge; d = addDays(d, 1)) { const h = holName(d); if (h) items.push({ title: h, s: d, e: d, c: HOLC, all: true, t: '', hol: true }); }
  for (const h of S.school.tasks) if (!h.done && h.due >= gs && h.due <= ge) { const c = clsById(h.classId); items.push({ title: '〆 ' + h.title, s: h.due, e: h.due, c: c ? c.color : COLORS[4], all: true, t: '' }); }
  for (const x of S.todos) if (!x.done && x.due && x.due >= gs && x.due <= ge) items.push({ title: '〆 ' + x.title, s: x.due, e: x.due, c: TODO_C, all: true, t: '' });

    segs.sort((a, b) => (a.ss < b.ss ? -1 : a.ss > b.ss ? 1 : 0) || (diffDays(b.ss, b.se) - diffDays(a.ss, a.se)) || ((b.hol ? 1 : 0) - (a.hol ? 1 : 0)) || ((b.all ? 1 : 0) - (a.all ? 1 : 0)) || a.t.localeCompare(b.t));
    const lanes = [], hidden = [0, 0, 0, 0, 0, 0, 0]; let bars = '';

/* ================= export to the iPhone Calendar (.ics) ================= */
function icsBuild() {
  const T = todayISO(), a = addDays(T, -30), z = addDays(T, 200), now = new Date();
  const esc2 = x => String(x || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const dd = d => d.replace(/-/g, ''), tt = t => t.replace(':', '') + '00';
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const fold = l => { const out = []; let cur = ''; for (const ch of l) { if (new TextEncoder().encode(cur + ch).length > 73) { out.push(cur); cur = ' ' + ch; } else cur += ch; } out.push(cur); return out.join('\r\n'); };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//hibi-techo//JP', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ひび手帳', 'X-WR-TIMEZONE:Asia/Tokyo',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Tokyo', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:JST', 'END:STANDARD', 'END:VTIMEZONE'];
  const alarm = +S.settings.icsAlarm || 0;
  const vev = (uid, d, ev, desc, loc, allDayEnd) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@hibi-techo`, `DTSTAMP:${stamp}`, `SUMMARY:${esc2(ev.title)}`);
    if (ev.allDay) { L.push(`DTSTART;VALUE=DATE:${dd(d)}`, `DTEND;VALUE=DATE:${dd(addDays(allDayEnd || d, 1))}`); }
    else { const end = allDayEnd && allDayEnd > d ? allDayEnd : toMin(ev.end) > toMin(ev.start) ? d : addDays(d, 1); L.push(`DTSTART;TZID=Asia/Tokyo:${dd(d)}T${tt(ev.start)}`, `DTEND;TZID=Asia/Tokyo:${dd(end)}T${tt(ev.end)}`); }
    if (desc) L.push(`DESCRIPTION:${esc2(desc)}`); if (loc) L.push(`LOCATION:${esc2(loc)}`);
    if (alarm && !ev.allDay) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc2(ev.title)}`, `TRIGGER:-PT${alarm}M`, 'END:VALARM');
    if (ev.allDay && ev.alarm9) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc2(ev.title)}`, 'TRIGGER:PT9H', 'END:VALARM');
    L.push('END:VEVENT');
  };
  let n = 0;
  for (const o of occurrences(a, z)) {
    const ev = o.ev; if (ev.routine || ev.cls) continue;
    const r = ev.route, desc = [ev.memo, r ? r.steps.filter(x => x.k === 'a' && !x.walk).map(x => `${x.line}${x.platform ? `（${x.platform}）` : ''}`).join(' → ') : '', (ev.items || []).length ? `持ち物：${ev.items.join('、')}` : ''].filter(Boolean).join('\n');
    vev(`${ev.id}-${o.date}`, o.date, ev, desc, ev.dest || (r ? `${r.from} → ${r.to}` : ''), o.end); n++;
  }
  for (const o of S.settings.icsClass === false ? [] : classOcc(a, z)) { vev(`${o.ev.id}-${o.date}`, o.date, o.ev, '大学の授業', (clsById(o.ev.cls) || {}).room || '', null); n++; }
  if (S.settings.icsTodo !== false) for (const x of todoItems()) if (!x.done && x.due && x.due >= a) { vev(`todo-${x.id}`, x.due, { title: `〆 ${x.title}${x.time ? `（${hm(x.time)}まで）` : ''}`, allDay: true, alarm9: true }, x.note, '', null); n++; }
  L.push('END:VCALENDAR');
  return { text: L.map(fold).join('\r\n') + '\r\n', n };
}

    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const max = 720, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); };

    const fallback = () => { const ta = $('#imp-text'); if (ta) { ta.value = txt; ta.focus(); ta.select(); } toast('下の欄を全選択してコピーしてください'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('バックアップをコピーしました。メモアプリなどに貼り付けて保管してください'), fallback); else fallback();
  },
  exportFile: () => { S.settings.lastBackup = Date.now(); save(true); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' })); a.download = `hibi-backup-${todayISO()}.json`; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  importText: () => { const v = ($('#imp-text') || {}).value || ''; if (!v.trim()) { toast('バックアップを貼り付けてください'); return; } importData(v); },
  exportBroken: () => { let raw = ''; try { raw = localStorage.getItem(KEY + '.broken') || ''; } catch (e) {} if (!raw) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([raw], { type: 'application/json' })); a.download = `hibi-unreadable-${todayISO()}.json`; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  resetAll: () => confirmIn('予定・日記・設定をすべて削除します。元に戻せません。', 'すべて削除', () => {
    try { for (const k of [WX_KEY, LV_KEY, 'hibi.accentColor', KEY + '.broken']) localStorage.removeItem(k); if (window.indexedDB) indexedDB.deleteDatabase('hibi-snaps'); } catch (e) {}
    snapCache = []; S = defaults(); migrateSchool(); save(); applyTheme(); while (stack.length) closeSheet(); render(); toast('すべてのデータを削除しました');
  }),
};
let noClickUntil = 0;
document.addEventListener('click', e => {
  if (Date.now() < noClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
  const ow = e.target.closest('.sw-wrap.open');
  if (ow && !e.target.closest('.sw-del')) { closeSwipes(null); e.preventDefault(); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'ev-allday') { syncEvent(); evDraft.allDay = t.checked; if (t.checked && !evDraft.endDate) evDraft.endDate = evDraft.date; if (!t.checked && evDraft.endDate <= evDraft.date) evDraft.endDate = ''; rerenderEvent(); }
  else if (t.id === 'ev-end-date2') { syncEvent(); if (multiDay(evDraft)) { evDraft.calOnly = true; evDraft.routine = false; } refreshEventLive(); }
  else if (t.id === 'ev-repeat') { syncEvent(); if (evDraft.repeat === 'weekly' && !(evDraft.days && evDraft.days.length)) evDraft.days = [wd(evDraft._seriesDate || evDraft.date)]; rerenderEvent(); }
  else if (t.id === 'set-hol') { S.settings.holidays = t.checked; save(); render(); }
  else if (t.id === 'tk-date' || t.id === 'tk-start') { syncTk(); if (topSheet() && topSheet().dataset.kind === 'task') refreshLive(tkHTML()); }
  else if (t.id === 'ev-date' || t.id === 'ev-sdate') { syncEvent(); const e = evDraft; if (t.value) e.date = t.value; if (e.endDate && e.endDate < e.date) e.endDate = e.allDay ? e.date : ''; refreshEventLive(); }
  else if (['ev-start', 'ev-end', 'ev-end-date'].includes(t.id)) { syncEvent(); refreshEventLive(); }
  else if (t.id === 'ev-until') { syncEvent(); rerenderEvent(); }
  else if (t.id === 'tm-motion') tmApply({ motion: t.checked });
  else if (/^tmc-\d$/.test(t.id)) { const c = tset().custom.slice(); c[+t.id.slice(4)] = t.value; tmApply({ custom: c, palette: 'custom' }); }
  else if (t.id === 'set-pay') { S.settings.showPay = t.checked; save(); render(); }
  else if (t.id === 'pay-limit') { S.settings.payLimit = Math.max(0, Math.round(+t.value || 0)); save(); rerenderKind('pay', paySheet); }
  else if (t.id === 'sc-start' || t.id === 'sc-end') { S.school[t.id === 'sc-start' ? 'termStart' : 'termEnd'] = t.value; save(); render(); }
  else if (t.id === 'sc-sat') { S.school.sat = t.checked; save(); render(); }
  else if (t.id === 'sc-hol') { S.school.holidayOff = t.checked; save(); render(); }
  else if (t.dataset && t.dataset.per !== undefined && t.value) { S.school.periods[+t.dataset.per][+t.dataset.k] = t.value; save(); render(); }
  else if (t.id === 'set-faceid') {
    if (!t.checked) { S.settings.lock = Object.assign({}, LK(), { cred: null }); save(); return; }
    faceRegister().then(id => { S.settings.lock = Object.assign({}, LK(), { cred: id }); save(); toast('Face IDで開けるようにしました'); }).catch(() => { t.checked = false; toast('Face IDを設定できませんでした'); });
  }
  else if (t.id === 'set-today') { S.settings.todayView = t.checked; save(); }
  else if (t.id === 'set-splash') { S.settings.splash = t.checked; save(); }
  else if (t.id === 'set-home') { S.settings.homeStation = t.value.trim(); save(); render(); }
  else if (t.id === 'set-walk' || t.id === 'set-margin') { S.settings[t.id === 'set-walk' ? 'leaveWalk' : 'leaveMargin'] = Math.max(0, Math.min(120, Math.round(+t.value || 0))); save(); render(); }
  else if (t.id === 'set-icsalarm') { S.settings.icsAlarm = +t.value; save(); }
  else if (t.id === 'set-icstodo' || t.id === 'set-icsclass') { S.settings[t.id === 'set-icstodo' ? 'icsTodo' : 'icsClass'] = t.checked; save(); }
  else if (t.id === 'set-norikae') { S.settings.norikae = t.value.trim(); save(); }
  else if (t.id === 'set-orb') { S.settings.orb = t.value.trim(); save(); }
  else if (t.id === 'set-baseball') { S.settings.baseball = t.value.trim(); save(); }
  else if (t.id === 'wx-rt') { radarStop(); radarShow(+t.value); }
  else if (t.id === 'bk-time' && t.value) { S.settings.bkTime = t.value; save(); checkBackup(); }
  else if (t.id === 'set-loc-entry' || t.id === 'set-loc-open') {
    const k = t.id === 'set-loc-entry' ? 'locEntry' : 'locOpen';
    if (!t.checked) { S.settings[k] = false; save(); return; }
    recordPlace(60000).then(() => { S.settings[k] = true; save(); toast('いまの場所を記録しました'); rerenderSettings(); })
      .catch(() => { t.checked = false; toast('位置情報を使えませんでした。iPhoneの「設定 → Safari → 位置情報」を確認してください'); });
  }
  else if (t.id === 'set-weather') {
    if (!t.checked) { S.settings.weather = false; save(); return; }
    getPos().then(() => { S.settings.weather = true; save(); toast('今日の日記に天気をつけるようにしました'); })
      .catch(() => { t.checked = false; toast('位置情報を使えませんでした。iPhoneの「設定 → Safari → 位置情報」を確認してください'); });
  }
  else if (t.id === 'ics-file' && t.files && t.files[0]) { const fr = new FileReader(); fr.onload = () => importICS(String(fr.result)); fr.readAsText(t.files[0]); t.value = ''; }
  else if (t.id === 'set-name') { S.settings.name = t.value.trim(); save(); render(); }
  else if (t.id === 'en-photo' && t.files && t.files[0]) { syncEntry(); try { enDraft.photo = await resizeImage(t.files[0]); rerenderEntry(); } catch (err) { toast(err.message); } }
  else if (t.id === 'imp-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(t.files[0]); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') runSearch();
  else if (e.target.id === 'sg-name' || e.target.id === 'sg-artist') songQuery();
  else if (e.target.id === 'wx-rt') { radarStop(); radarShow(+e.target.value); }
  else if (/^tmc-\d$/.test(e.target.id)) { const c = tset().custom.slice(); c[+e.target.id.slice(4)] = e.target.value; S.settings.timer = Object.assign(tset(), { custom: c, palette: 'custom' }); const ts = stack.map(o => o.firstElementChild).find(x => x.dataset.kind === 'timer'); if (ts) ts.firstElementChild.setAttribute('style', tVars(tset(), S.timer.color)); }
  else if (e.target.id === 'tk-title' && tkDraft) {
    tkDraft.title = e.target.value; const sh = topSheet();
    if (!tkDraft._iconSet) { tkDraft.icon = guessIcon(tkDraft.title); const sq = $('.tk-icon .sq', sh); if (sq) sq.innerHTML = ico(tkDraft.icon); }
    const sg = $('#tk-sugg', sh); if (sg) sg.innerHTML = suggHTML();
    const nx = $('#tk-next', sh); if (nx) nx.disabled = !tkDraft.title.trim();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) closeSheet();
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'ev-item') { e.preventDefault(); ACT.evItemAdd(); return; }
  if (e.target.id === 'td-title') { e.preventDefault(); e.target.blur(); return; }
  if (e.target.id === 'tk-sub') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; syncTk(); tkDraft.subtasks.push({ t: v, done: false }); rerenderTk(); const n = $('#tk-sub', topSheet()); n && n.focus({ preventScroll: true }); }
  else if (e.target.id === 'tk-title' && tkStep === 'title') { e.preventDefault(); ACT.tkNext(); }
});

/* swipe: month / week strips */
let sx = 0, sy = 0, zone = null;
main.addEventListener('touchstart', e => { const z = e.target.closest('[data-swipe]'); zone = z ? z.dataset.swipe : null; if (zone) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
main.addEventListener('touchend', e => {
  if (!zone) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, z = zone; zone = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  const dir = dx < 0 ? 1 : -1;
  st.anim = { sel: { month: '#monthGrid', week: '#weekStrip', jweek: '#jwGrid' }[z], dir };
  if (z === 'month') { const F = P(st.calMonth); F.setMonth(F.getMonth() + dir); st.calMonth = iso(F); const first = st.calMonth; st.sel = first.slice(0, 7) === todayISO().slice(0, 7) ? todayISO() : first; }
  else if (z === 'week') { st.day = addDays(st.day, dir * 7); }
  else if (z === 'jweek') { st.jWeek = Math.min(0, st.jWeek + dir); }
  render();
}, { passive: true });

/* long-press a timeline icon, then drag up/down to move the event (1px = 1 minute, 5-minute steps) */
let dg = null;
main.addEventListener('touchstart', e => {
  const pill = e.target.closest('.pill[data-id]'); if (!pill || e.touches.length > 1) return;
  const ev = S.events.find(x => x.id === pill.dataset.id); if (!ev || ev.allDay) return;
  const t = e.touches[0], item = pill.closest('.tl-item');
  dg = { item, ev, d: pill.dataset.d, x: t.clientX, y: t.clientY, on: false, delta: 0, s: toMin(ev.start), len: evLen(ev), ov: overnight(ev) };
  dg.timer = setTimeout(() => { if (dg) { dg.on = true; item.classList.add('dragging'); } }, 320);
}, { passive: true });
main.addEventListener('touchmove', e => {
  if (!dg) return; const t = e.touches[0], dy = t.clientY - dg.y;
  if (!dg.on) { if (Math.abs(dy) > 8 || Math.abs(t.clientX - dg.x) > 8) { clearTimeout(dg.timer); dg = null; } return; }
  e.preventDefault();
  const delta = Math.max(-dg.s, Math.min(dg.ov ? 1439 - dg.s : 1439 - dg.s - dg.len, Math.round(dy / 5) * 5));
  dg.delta = delta; dg.item.style.transform = `translateY(${dy}px)`;
  const st0 = dg.s + delta, a = hhmm(st0), b = (st0 + dg.len >= 1440 ? '翌' : '') + hm(hhmm((st0 + dg.len) % 1440));
  dg.item.querySelector('.meta').textContent = `${hm(a)} – ${b}（${dur(dg.len)}）`;
  dg.item.querySelector('.tm').textContent = hm(a);
}, { passive: false });
const endDrag = () => {
  if (!dg) return; clearTimeout(dg.timer); const g = dg; dg = null;
  if (!g.on) return;
  noClickUntil = Date.now() + 450;
  g.item.classList.remove('dragging'); g.item.style.transform = '';
  render();
  if (g.delta) shiftEvent(g.ev.id, g.d, g.delta);
};
main.addEventListener('touchend', endDrag);
main.addEventListener('touchcancel', endDrag);

/* あとで: swipe a row left to reveal 削除, or swipe all the way to delete (iOS style) */
const SW_OPEN = 88;
let sw = null;
function swSet(wrap, x, anim) {
  const row = wrap.querySelector('.ib-row'); row.style.transition = anim ? '' : 'none';
  row.style.transform = x ? `translateX(${x}px)` : ''; wrap.style.setProperty('--rev', `${Math.max(0, -x)}px`);
}
function collapseRow(wrap, done) {
  wrap.classList.add('drag'); swSet(wrap, -wrap.offsetWidth, true);
  setTimeout(() => { wrap.style.height = wrap.offsetHeight + 'px'; void wrap.offsetHeight; wrap.style.height = '0px'; wrap.style.opacity = '0'; }, 160);
  setTimeout(done, 420);
}
const closeSwipes = keep => document.querySelectorAll('.sw-wrap.open').forEach(w => { if (w !== keep) { w.classList.remove('open'); swSet(w, 0, true); setTimeout(() => w.classList.remove('drag'), 320); } });
document.addEventListener('touchstart', e => {
  if (!e.target.closest('.sw-wrap.open')) closeSwipes(null);
  const row = e.target.closest('.sw-wrap .ib-row'); if (!row || e.touches.length > 1) return;
  const wrap = row.parentElement; if (wrap.dataset.going) return;
  sw = { wrap, x: e.touches[0].clientX, y: e.touches[0].clientY, base: wrap.classList.contains('open') ? -SW_OPEN : 0, w: wrap.offsetWidth, cur: 0, on: false };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!sw) return; const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { sw.on = true; sw.wrap.classList.add('drag'); }
    else { if (Math.abs(dy) > 8) sw = null; return; }
  }
  e.preventDefault();
  let x = sw.base + dx; if (x > 0) x = x * 0.2; x = Math.max(-sw.w, x);
  sw.cur = x; swSet(sw.wrap, x, false);
}, { passive: false });
const swEnd = () => {
  if (!sw) return; const g = sw; sw = null; if (!g.on) return;
  noClickUntil = Date.now() + 350;
  if (g.cur < -g.w * 0.55) { const b = g.wrap.querySelector('.sw-del'); g.wrap.dataset.going = '1'; collapseRow(g.wrap, () => ACT.taskDel({ dataset: b.dataset })); return; }
  const open = g.cur < -SW_OPEN / 2;
  g.wrap.classList.toggle('open', open); swSet(g.wrap, open ? -SW_OPEN : 0, true);
  if (!open) setTimeout(() => g.wrap.classList.remove('drag'), 320);
};
document.addEventListener('touchend', swEnd); document.addEventListener('touchcancel', swEnd);

/* keep "today" fresh when the app comes back to the foreground */
let lastDay = todayISO();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  tick();
  const T = todayISO(); if (T !== lastDay) { if (st.sel === lastDay) st.sel = T; if (st.day === lastDay) { st.day = T; } st.calMonth = st.sel.slice(0, 8) + '01'; lastDay = T; }
  render(); autoPlace(); checkBackup(); wxRefresh();
});

/* ================= boot ================= */
load();
const T0 = todayISO(); st.sel = st.day = T0; st.calMonth = T0.slice(0, 8) + '01';
applyTheme(); if (lockOn()) showLock('unlock');
try { render(); } catch (e) { console.error(e); main.innerHTML = `<p class="empty">画面を表示できませんでした。データは消えていません。<br>設定 → バックアップ から書き出して、もう一度読み込んでみてください。</p><div style="text-align:center"><button class="btn primary" data-act="settings">設定を開く</button></div>`; }
ensureTick();
if (loadFailed) setTimeout(() => toast('保存されていたデータを読み込めませんでした。元のデータは別に保管してあります（設定 → バックアップ）'), 2400);
try { localStorage.removeItem('hibi.spotify'); } catch (e) {}
autoPlace(); checkBackup(); wxRefresh();
function openToday() { const sh = openSheet(todaySheet(), 'full'); sh.dataset.kind = 'today'; }
if (S.settings.todayView !== false && !new URLSearchParams(location.search).has('notoday')) openToday();
if ($('#splash')) { const quick = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; setTimeout(endSplash, quick ? 700 : 1950); $('#splash').addEventListener('click', () => endSplash(true)); }
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
