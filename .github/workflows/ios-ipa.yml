# ひび手帳の iOS アプリ（署名なし IPA）を作る。
# GitHub の標準 macOS ランナー（無料枠）で、Capacitor 8 の iOS プロジェクトを毎回作り直してビルドする。
# できた IPA は Artifacts「hibi-unsigned-ipa」に 7 日間置く。iPhone には AltStore などで個人署名して入れる。
name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - privacy.html
      - icons/**
      - startup/**
      - ios-assets/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - scripts/**
      - native/**
      - .github/workflows/ios-ipa.yml

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # llama.cpp の版（Gemma 4・Qwen3.5・LFM3・Bonsai 2 の Q2_0 に対応している版）
  LLAMA_CPP_REF: v0.9.0

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # まいにち（AI）も一緒に入れる（ひび手帳は ../hibi2/ を開くので、アプリの中の hibi2/ に置く）
      - uses: actions/checkout@v5
        with:
          repository: weakestandstrongest-sketch/hibi2
          path: hibi2-src

      # まいにち の AI をアプリの中で動かす llama.cpp（GGUF のモデル用）。作るのに数分かかるので、同じ版ならキャッシュを使う
      - name: llama.cpp for iOS (cache)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: native/hibi-llm/ios/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_CPP_REF }}-ios-device-v1

      - name: Build llama.cpp for iOS
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$LLAMA_CPP_REF" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          ./build-xcframework.sh ios-device
          mkdir -p "$GITHUB_WORKSPACE/native/hibi-llm/ios"
          rm -rf "$GITHUB_WORKSPACE/native/hibi-llm/ios/llama.xcframework"
          cp -R build-apple/llama.xcframework "$GITHUB_WORKSPACE/native/hibi-llm/ios/"

      - name: Check llama.xcframework
        run: |
          ls native/hibi-llm/ios/llama.xcframework
          find native/hibi-llm/ios/llama.xcframework -name llama.h | head -1 | xargs grep -c llama_model_load_from_file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Build www/
        env:
          HIBI2_DIR: hibi2-src
          HIBI2_REQUIRED: '1'
        run: |
          npm run build
          test -f www/index.html
          test -f www/hibi2/ai/mainichi-ai.js

      - name: Add iOS platform
        run: npx cap add ios

      - name: App icons and Info.plist (URL scheme for the Google login, Face ID etc.)
        run: npm run ios:setup

      - name: Sync
        run: |
          npx cap sync ios
          # まいにち の AI のプラグインが入っているか
          grep -n 'HibiLlm' ios/App/CapApp-SPM/Package.swift
          grep -n 'HibiLLMPlugin' ios/App/App/capacitor.config.json

      # ショートカット・Siri とバックグラウンドの更新（アプリ本体）、ウィジェットとライブアクティビティ（拡張機能 HibiWidgets）
      - name: Widgets, Siri, background refresh
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby scripts/ios-extras.rb

      - name: Show versions
        run: |
          xcodebuild -version
          node -v
          grep -m1 IPHONEOS_DEPLOYMENT_TARGET ios/App/App.xcodeproj/project.pbxproj

      - name: Build (Release, no signing)
        run: |
          set -o pipefail
          cd ios/App
          # Capacitor 8 は Swift Package Manager（App.xcodeproj）。CocoaPods のときは App.xcworkspace を使う
          if [ -d App.xcworkspace ]; then TARGET=(-workspace App.xcworkspace); else TARGET=(-project App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Make IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          # the home screen name in Japanese (Info.plist keeps the plain "Hibi" that AltStore can register with Apple)
          cp -R ios-assets/ja.lproj "$APP/"
          plutil -lint "$APP/ja.lproj/InfoPlist.strings"
          # sign each part ad hoc with the App Group, so AltStore registers it (the app and the widget share 「今日の予定」 there)
          test -d "$APP/PlugIns/HibiWidgets.appex"
          for f in "$APP"/Frameworks/*; do codesign -f -s - "$f"; done
          codesign -f -s - --entitlements ios-assets/hibi.entitlements "$APP/PlugIns/HibiWidgets.appex"
          codesign -f -s - --entitlements ios-assets/hibi.entitlements "$APP"
          codesign -d --entitlements - "$APP" | grep -c application-groups
          rm -rf Payload hibi-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # ditto keeps the bundle as it is (symlinks, permissions); the result is a normal ZIP named .ipa
          ditto -c -k --sequesterRsrc --keepParent Payload hibi-unsigned.ipa
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/Info.plist$'
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/Frameworks/llama.framework/llama$'
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/PlugIns/HibiWidgets.appex/HibiWidgets$'
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/ja.lproj/InfoPlist.strings$'
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/public/index.html$'
          unzip -l hibi-unsigned.ipa | grep -q ' Payload/App.app/public/hibi2/ai/mainichi-ai.js$'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$APP/Info.plist"
          unzip -l hibi-unsigned.ipa | grep ' Payload/App.app/' | head -5
          ls -lh hibi-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: hibi-unsigned-ipa
          path: hibi-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
